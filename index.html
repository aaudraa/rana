function initRender(opts) {
  bgc = document.getElementById('bg'); bg = bgc.getContext('2d', { alpha: false });
  cv = document.getElementById('c'); ctx = cv.getContext('2d', { alpha: true });
  glc = document.getElementById('gl');
  fxc = document.getElementById('fx'); fx = fxc.getContext('2d');
  lyc = document.getElementById('ly'); ly = lyc.getContext('2d');
  atlas = document.createElement('canvas'); actx = atlas.getContext('2d');
  glowA = document.createElement('canvas'); gA = glowA.getContext('2d');
  glowB = document.createElement('canvas'); gB = glowB.getContext('2d');
  R.noGL = !!(opts && opts.noGL);
  R.gl = R.noGL ? null : glInit();
}

const layers = () => ({ bg, fx, ly, W: R.W, H: R.H, dpr: R.dpr });
const dims = () => R;

function resizeRender(cssW, cssH, dpr, fontOverride) {
  R.dpr = dpr; R.cssW = cssW; R.cssH = cssH;
  R.W = Math.round(cssW * dpr); R.H = Math.round(cssH * dpr);
  for (const c of [cv, bgc, fxc, lyc]) { c.width = R.W; c.height = R.H; }
  const f = fontOverride || Math.max(6, Math.min(11, Math.sqrt(cssW * cssH / 9500)));
  R.fontPx = f * dpr;
  actx.font = `${R.fontPx}px ${FONT}`;
  R.CW = Math.max(3, Math.round(actx.measureText('M').width));
  R.CH = Math.max(5, Math.round(R.fontPx * 1.18));
  R.cols = Math.max(10, Math.floor(R.W / R.CW)); R.rows = Math.max(10, Math.floor(R.H / R.CH));
  R.offX = Math.floor((R.W - R.cols * R.CW) / 2); R.offY = Math.floor((R.H - R.rows * R.CH) / 2);
  if (R.gl && !glSetup()) R.gl = null;
  if (!R.gl) {
    R.slotsX = Math.max(1, Math.floor(2048 / R.CW));
    const slotsY = Math.max(1, Math.floor(2048 / R.CH));
    atlas.width = R.slotsX * R.CW; atlas.height = slotsY * R.CH;
    R.slotMax = R.slotsX * slotsY;
    resetAtlas();
  }
  glc.style.display = R.gl ? '' : 'none';
  cv.style.display = R.gl ? 'none' : '';
  document.documentElement.setAttribute('data-renderer', R.gl ? 'webgl' : '2d');
  glowA.width = Math.max(1, Math.round(R.W / 4)); glowA.height = Math.max(1, Math.round(R.H / 4));
  glowB.width = Math.max(1, Math.round(R.W / 16)); glowB.height = Math.max(1, Math.round(R.H / 16));
  gA.imageSmoothingQuality = 'high'; gB.imageSmoothingQuality = 'high';
  return R;
}

function resetAtlas() {
  actx.setTransform(1, 0, 0, 1, 0, 0);
  actx.clearRect(0, 0, atlas.width, atlas.height);
  actx.font = `${R.fontPx}px ${FONT}`;
  actx.textAlign = 'center';
  actx.textBaseline = 'middle';
  R.slotMap.clear();
  R.slotUsed = 0;
}

const q5 = v => (v <= 0 ? 0 : v >= 1 ? 31 : Math.round(v * 31));
function slotFor(gi, r, g, b) {
  const key = gi * 32768 + ((q5(r) << 10) | (q5(g) << 5) | q5(b));
  let s = R.slotMap.get(key);
  if (s === undefined) {
    if (R.slotUsed >= R.slotMax) resetAtlas();
    s = R.slotUsed++;
    const sx = (s % R.slotsX) * R.CW, sy = ((s / R.slotsX) | 0) * R.CH;
    actx.save();
    actx.beginPath(); actx.rect(sx, sy, R.CW, R.CH); actx.clip();
    actx.fillStyle = `rgb(${q5(r) * 8.226 | 0},${q5(g) * 8.226 | 0},${q5(b) * 8.226 | 0})`;
    actx.fillText(GLYPHS[gi], sx + R.CW / 2, sy + R.CH * 0.54);
    actx.restore();
    R.slotMap.set(key, s);
  }
  return s;
}

function flush2d(grid, sx, sy) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, R.W, R.H);
  const { G, RGB, cols, N } = grid;
  for (let i = 0; i < N; i++) {
    const gi = G[i];
    if (gi < 0) continue;
    const o = i * 3;
    const s = slotFor(gi, RGB[o], RGB[o + 1], RGB[o + 2]);
    const r = (i / cols) | 0, c = i - r * cols;
    ctx.drawImage(atlas, (s % R.slotsX) * R.CW, ((s / R.slotsX) | 0) * R.CH, R.CW, R.CH,
      R.offX + sx + c * R.CW, R.offY + sy + r * R.CH, R.CW, R.CH);
  }
}

function glInit() {
  let g = null;
  try { g = glc.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true }); } catch (e) { return null; }
  if (!g) return null;
  const VS = `
    attribute vec2 aCell; attribute float aGlyph; attribute vec3 aColor;
    uniform vec2 uRes, uCell, uOff; uniform float uPt;
    varying float vGlyph; varying vec3 vColor;
    void main() {
      vec2 p = uOff + aCell * uCell + uPt * 0.5;
      vec2 c = p / uRes * 2.0 - 1.0;
      gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
      gl_PointSize = uPt;
      vGlyph = aGlyph; vColor = aColor;
    }`;
  const FS = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    uniform sampler2D uAtlas; uniform vec2 uCell, uAtlasSize; uniform float uPt, uAtlasCols;
    varying float vGlyph; varying vec3 vColor;
    void main() {
      vec2 q = gl_PointCoord * uPt;
      if (q.x >= uCell.x || q.y >= uCell.y) discard;
      float gy = floor((vGlyph + 0.5) / uAtlasCols);
      float gx = vGlyph - gy * uAtlasCols;
      float a = texture2D(uAtlas, (vec2(gx, gy) * uCell + q) / uAtlasSize).a;
      if (a < 0.01) discard;
      gl_FragColor = vec4(vColor * a, a);
    }`;
  try {
    const sh = (type, src) => {
      const s = g.createShader(type); g.shaderSource(s, src); g.compileShader(s);
      if (!g.getShaderParameter(s, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(s));
      return s;
    };
    const p = g.createProgram();
    g.attachShader(p, sh(g.VERTEX_SHADER, VS)); g.attachShader(p, sh(g.FRAGMENT_SHADER, FS));
    g.linkProgram(p);
    if (!g.getProgramParameter(p, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(p));
    g.useProgram(p);
    const U = {};
    for (const n of ['uRes', 'uCell', 'uOff', 'uPt', 'uAtlas', 'uAtlasSize', 'uAtlasCols']) U[n] = g.getUniformLocation(p, n);
    U.aCell = g.getAttribLocation(p, 'aCell'); U.aGlyph = g.getAttribLocation(p, 'aGlyph'); U.aColor = g.getAttribLocation(p, 'aColor');
    R.glU = U;
  } catch (e) { return null; }
  R.glBuf = g.createBuffer();
  R.glTex = g.createTexture();
  g.enable(g.BLEND);
  g.blendFunc(g.ONE, g.ONE_MINUS_SRC_ALPHA);
  glc.addEventListener('webglcontextlost', ev => { ev.preventDefault(); R.gl = null; resizeRender(R.cssW, R.cssH, R.dpr); });
  return g;
}

function glSetup() {
  const gl = R.gl, U = R.glU;
  const pt = Math.max(R.CW, R.CH) + (Math.max(R.CW, R.CH) & 1);
  const range = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE);
  if (!range || range[1] < pt) return false;
  glc.width = R.W; glc.height = R.H;
  gl.viewport(0, 0, R.W, R.H);
  const ac = Math.max(1, Math.floor(2048 / R.CW));
  atlas.width = ac * R.CW; atlas.height = Math.ceil(GLYPHS.length / ac) * R.CH;
  actx.font = `${R.fontPx}px ${FONT}`; actx.textAlign = 'center'; actx.textBaseline = 'middle'; actx.fillStyle = '#fff';
  GLYPHS.forEach((ch, i) => {
    const sx = (i % ac) * R.CW, sy = Math.floor(i / ac) * R.CH;
    actx.save(); actx.beginPath(); actx.rect(sx, sy, R.CW, R.CH); actx.clip();
    actx.fillText(ch, sx + R.CW / 2, sy + R.CH * 0.54);
    actx.restore();
  });
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, R.glTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform2f(U.uRes, R.W, R.H); gl.uniform2f(U.uCell, R.CW, R.CH); gl.uniform2f(U.uOff, R.offX, R.offY);
  gl.uniform1f(U.uPt, pt); gl.uniform1i(U.uAtlas, 0);
  gl.uniform2f(U.uAtlasSize, atlas.width, atlas.height); gl.uniform1f(U.uAtlasCols, ac);
  R.glData = new Float32Array(R.cols * R.rows * 6);
  gl.bindBuffer(gl.ARRAY_BUFFER, R.glBuf);
  gl.bufferData(gl.ARRAY_BUFFER, R.glData.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(U.aCell); gl.vertexAttribPointer(U.aCell, 2, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(U.aGlyph); gl.vertexAttribPointer(U.aGlyph, 1, gl.FLOAT, false, 24, 8);
  gl.enableVertexAttribArray(U.aColor); gl.vertexAttribPointer(U.aColor, 3, gl.FLOAT, false, 24, 12);
  return true;
}

function flushGL(grid, sx, sy) {
  const gl = R.gl, d = R.glData;
  const { G, RGB, cols, N } = grid;
  let n = 0;
  for (let i = 0; i < N; i++) {
    const gi = G[i];
    if (gi < 0) continue;
    const r = (i / cols) | 0, o = n * 6, ci = i * 3;
    d[o] = i - r * cols; d[o + 1] = r; d[o + 2] = gi;
    d[o + 3] = RGB[ci]; d[o + 4] = RGB[ci + 1]; d[o + 5] = RGB[ci + 2];
    n++;
  }
  gl.uniform2f(R.glU.uOff, R.offX + sx, R.offY + sy);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (n) { gl.bufferSubData(gl.ARRAY_BUFFER, 0, d.subarray(0, n * 6)); gl.drawArrays(gl.POINTS, 0, n); }
}

function present(grid, shakeX = 0, shakeY = 0) {
  if (R.gl) flushGL(grid, shakeX, shakeY); else flush2d(grid, shakeX, shakeY);
}

function clearLayers(bgColor) {
  bg.globalAlpha = 1; bg.globalCompositeOperation = 'source-over';
  bg.fillStyle = bgColor; bg.fillRect(0, 0, R.W, R.H);
  fx.globalAlpha = 1; fx.globalCompositeOperation = 'source-over'; fx.clearRect(0, 0, R.W, R.H);
  ly.globalAlpha = 1; ly.globalCompositeOperation = 'source-over'; ly.clearRect(0, 0, R.W, R.H);
}

function glow(amount) {
  if (amount <= 0) return;
  gA.globalCompositeOperation = 'copy'; gA.drawImage(R.gl ? glc : cv, 0, 0, glowA.width, glowA.height);
  gB.globalCompositeOperation = 'copy'; gB.drawImage(glowA, 0, 0, glowB.width, glowB.height);
  fx.save();
  fx.globalCompositeOperation = 'lighter';
  fx.globalAlpha = Math.min(1, amount * 0.55); fx.drawImage(glowA, 0, 0, R.W, R.H);
  fx.globalAlpha = Math.min(1, amount * 0.85); fx.drawImage(glowB, 0, 0, R.W, R.H);
  fx.restore();
}


const AUDIO_WAIT = 3;
const SNAP = 0.25, SLEW = 0.12;

function timeSource(s, nowS, a) {
  let t0 = s.t0, wait = s.wait;
  if (wait !== null) {
    if (a.error || (a.currentTime > 0 && !a.paused)) wait = null;
    else if (nowS < wait) return { t0: nowS, wait };
    else wait = null;
  }
  const t = nowS - t0;
  if (a.error || a.ended || a.currentTime <= 0 || t > T.end - 0.5) return { t0, wait };
  if (a.paused) return { t0: nowS - a.currentTime, wait };
  const d = a.currentTime - t;
  t0 -= Math.abs(d) > SNAP ? d : d * SLEW;
  return { t0, wait };
}

const QUALITY = [{ SX: 3, SY: 4, back: 1 }, { SX: 2, SY: 3, back: 0.7 }, { SX: 2, SY: 2, back: 0.45 }];

function qualityStep(level, hist) {
  if (hist.length < 40 || level >= QUALITY.length - 1) return level;
  const med = [...hist].sort((x, y) => x - y)[hist.length >> 1];
  return med > 33 ? level + 1 : level;
}


const qs = new URLSearchParams(location.search);
const STILL = qs.has('t') ? (parseFloat(qs.get('t')) || 0) : null;
const REC = qs.has('rec');
const TEST = qs.has('test');
const BENCH = qs.has('bench');
const DEMO = qs.get('demo') || '';
const FONT_PX = qs.has('f') ? parseFloat(qs.get('f')) : 0;
const BG = '#050608';

let grid = makeGrid(1, 1);
let view = null;
let RD = null;
let level = 0;
const shake = [0, 0];

function demoGrid(t) {
  const { cols, rows } = grid;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const u = c / (cols - 1), v = r / (rows - 1);
      const band = (r / 6) | 0;
      let gi;
      if (band % 3 === 2) gi = orientId((c / 3 + t) * Math.PI / 4);
      else gi = gid(RAMP[Math.floor(u * (RAMP.length - 1))]);
      gridPut(grid, r * cols + c, gi, 0.55 + 0.45 * u, 0.75 + 0.25 * (1 - v), 1);
    }
  }
}

function renderAt(t) {
  clearLayers(BG);
  gridClear(grid);
  shake[0] = 0; shake[1] = 0;
  const Ls = layers();
  if (!DEMO && t >= T.end) {
    present(grid, 0, 0);
    return;
  }
  let g = 0.9;
  if (DEMO === 'grid') demoGrid(t);
  else if (DEMO === 'butterfly') demoButterfly(t, view, grid);
  else if (DEMO === 'hover') demoHover(t, view, grid);
  else {
    const o = renderStory(t, view, grid, Ls.fx);
    shake[0] = o.shake[0]; shake[1] = o.shake[1]; g = o.glow;
  }
  present(grid, shake[0], shake[1]);
  glow(g);
  if (DEMO) return;
  prewarmLyrics(t, Ls.W, Ls.H);
  drawLyrics(Ls.ly, t, Ls.W, Ls.H);
  const k = smooth(T.fadeFrom, T.end, t);
  if (k > 0) {
    Ls.ly.fillStyle = `rgba(5,6,8,${k})`;
    Ls.ly.fillRect(0, 0, Ls.W, Ls.H);
  }
}

function buildView() {
  const q = QUALITY[level];
  view = makeView(RD, q.SX, q.SY);
  view.back = q.back;
}

function onResize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  RD = resizeRender(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight), dpr, FONT_PX * dpr || 0);
  grid = makeGrid(RD.cols, RD.rows);
  buildView();
}

function selfTest() {
  const fails = [];
  const check = (name, ok) => { if (!ok) fails.push(name); };
  const TIMES = [0.3, 0.9, 12, 30.5, 36.95, 37.2, 38.5, 45, 52.5, 56, 61.5, 62.8, 70, 76.9, 86, 93, 97.5];
  const tryAll = label => {
    for (const t of TIMES) {
      try { renderAt(t); } catch (e) { fails.push(`${label}@${t}: ${e.message}`); }
    }
  };
  const inkAt = t => {
    renderAt(t);
    let n = 0;
    for (const v of grid.G) if (v >= 0) n++;
    return n;
  };
  const lyInk = (t, x, y, w, h) => {
    renderAt(t);
    const d = layers().ly.getImageData(x, y, w, h).data;
    let n = 0;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 40) n++;
    return n;
  };
  tryAll('render');
  const Ls = layers();
  check('blackBeforeFirstHit', inkAt(0.3) === 0);
  check('glassAt20', inkAt(20) > 100);
  check('butterfliesAt45', inkAt(45) > 100);
  check('fieldAt70', inkAt(70) > grid.N * 0.2);
  check('fontsLoaded', document.fonts.check('700 20px rblock') && document.fonts.check('600 20px rscript'));
  check('lyricsInSky@70', lyInk(70, 0, 0, Ls.W, Math.floor(Ls.H * 0.34)) > 50);
  check('noLyricsInField@70', lyInk(70, 0, Math.ceil(Ls.H * 0.36), Ls.W, Math.floor(Ls.H * 0.6)) === 0);
  check('noLyricsBefore@67', lyInk(67.5, 0, 0, Ls.W, Ls.H) === 0);
  check('blackAtEnd', inkAt(97.2) === 0);
  {
    for (let i = 0; i < 40; i++) prewarmLyrics(66 + i / 30, Ls.W, Ls.H);
    const before = lyricsCacheInfo().built;
    drawLyrics(Ls.ly, 69.3, Ls.W, Ls.H);
    check('lyricsBuiltBeforeTheyPop', before > 0 && lyricsCacheInfo().built === before);
    for (let i = 0; i < 40; i++) prewarmLyrics(80 + i / 30, Ls.W, Ls.H);
    drawLyrics(Ls.ly, 81, Ls.W, Ls.H);
    check('oldLyricsFreed', lyricsCacheInfo().phrases.every(k => k >= 5));
  }
  {
    renderAt(96.99);
    const d = layers().ly.getImageData(Ls.W >> 1, Ls.H >> 1, 1, 1).data;
    check('fadedAt97', d[3] >= 250);
  }
  {
    const keep = [window.innerWidth, window.innerHeight];
    for (const [w, h] of [[360, 640], [1920, 1080], [640, 360]]) {
      RD = resizeRender(w, h, 1, 0);
      grid = makeGrid(RD.cols, RD.rows);
      buildView();
      tryAll(`resize${w}x${h}`);
    }
    RD = resizeRender(keep[0], keep[1], Math.min(window.devicePixelRatio || 1, 2), 0);
    grid = makeGrid(RD.cols, RD.rows);
    buildView();
  }
  {
    const l0 = level;
    level = qualityStep(level, Array(60).fill(45));
    buildView();
    check('qualityStepsDown', level === l0 + 1 && view.SX * view.SY < 12);
    tryAll('lowQuality');
    check('lowQualityField', inkAt(70) > grid.N * 0.15);
    level = l0;
    buildView();
  }
  return fails;
}

function bench() {
  const out = [];
  for (const t0 of [20, 38.5, 45, 57, 63, 75]) {
    for (let i = 0; i < 5; i++) renderAt(t0 + i / 30);
    const a = performance.now();
    for (let i = 0; i < 30; i++) renderAt(t0 + i / 30);
    out.push(`${t0}:${((performance.now() - a) / 30).toFixed(1)}`);
  }
  return out.join(' ');
}

async function boot() {
  const html = document.documentElement;
  window.addEventListener('error', e => html.setAttribute('data-err', String(e.message || e)));
  initRender({ noGL: qs.has('nogl') });
  onResize();
  const start = document.getElementById('start');
  const replayBtn = document.getElementById('replay');
  const audio = document.getElementById('music');
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) start.querySelector('.label').textContent = 'dokun';
  await loadLyricFonts();
  window.__renderAt = t => { renderAt(t); return dims().cols + 'x' + dims().rows; };
  if (TEST || BENCH || REC || STILL !== null || DEMO) {
    start.classList.add('hide');
    start.style.display = 'none';
    window.addEventListener('resize', () => { onResize(); if (STILL !== null) renderAt(STILL); });
    if (TEST) {
      let fails;
      try { fails = selfTest(); } catch (e) { fails = ['selfTest: ' + e.message]; }
      html.setAttribute('data-test', fails.length ? fails.join('; ') : 'ok');
      return;
    }
    if (BENCH) { html.setAttribute('data-bench', bench()); return; }
    if (REC) return;
    if (STILL !== null) { renderAt(STILL); return; }
    const t0 = performance.now();
    const loop = () => { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    return;
  }

  const now = () => performance.now() / 1000;
  let started = false, clock = { t0: 0, wait: null }, replayShown = false, lastT = 0;
  let hist = [], lastFrame = 0;
  const play = from => {
    try { audio.currentTime = from; } catch (e) { }
    try { const p = audio.play(); if (p && p.catch) p.catch(() => { }); } catch (e) { }
  };
  const begin = () => {
    clock = { t0: now(), wait: now() + AUDIO_WAIT };
    replayShown = false;
    replayBtn.classList.remove('show');
    play(0);
  };
  const resume = () => {
    if (!started || !audio.paused || audio.ended || lastT > T.end - 0.5) return;
    play(Math.max(0, lastT));
  };
  start.addEventListener('click', () => {
    if (started) return;
    started = true;
    start.classList.add('hide');
    const el = document.documentElement;
    try {
      const fs = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fs) { const p = fs.call(el); if (p && p.catch) p.catch(() => { }); }
    } catch (e) { }
    begin();
  });
  replayBtn.addEventListener('click', ev => { ev.stopPropagation(); begin(); });
  window.addEventListener('pointerdown', ev => { if (!(ev.target && ev.target.closest && ev.target.closest('button'))) resume(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resume(); });
  let resizeQueued = false;
  window.addEventListener('resize', () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; onResize(); renderAt(started ? lastT : 0); });
  });
  renderAt(0);
  const loop = () => {
    if (started) {
      const n = now();
      clock = timeSource(clock, n, audio);
      lastT = n - clock.t0;
      renderAt(lastT);
      if (lastFrame && lastT > 0.5 && lastT < T.end) {
        hist.push((n - lastFrame) * 1000);
        if (hist.length > 90) hist.shift();
        const next = qualityStep(level, hist);
        if (next !== level) { level = next; hist = []; buildView(); }
      }
      lastFrame = n;
      if (lastT > T.end && !replayShown) { replayShown = true; replayBtn.classList.add('show'); }
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

boot();
