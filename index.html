<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const smoothU = u => u * u * (3 - 2 * u);
const smooth = (a, b, x) => smoothU(clamp01((x - a) / (b - a)));
const easeOut = u => 1 - (1 - u) * (1 - u) * (1 - u);
const easeInOut = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

function hash(a, b, c) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul((c | 0) + 0x3c6ef372, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function mulberry(a) {
  a = a >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function spline(keys) {
  const n = keys.length;
  const tan = keys.map((k, i) => {
    const a = keys[Math.max(0, i - 1)], b = keys[Math.min(n - 1, i + 1)];
    const dt = b[0] - a[0] || 1;
    return [(b[1] - a[1]) / dt, (b[2] - a[2]) / dt, (b[3] - a[3]) / dt];
  });
  return t => {
    if (t <= keys[0][0]) return keys[0].slice(1);
    if (t >= keys[n - 1][0]) return keys[n - 1].slice(1);
    let i = 0;
    while (keys[i + 1][0] < t) i++;
    const a = keys[i], b = keys[i + 1], h = b[0] - a[0], u = (t - a[0]) / h;
    const u2 = u * u, u3 = u2 * u;
    const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
    return [1, 2, 3].map(j => h00 * a[j] + h10 * h * tan[i][j - 1] + h01 * b[j] + h11 * h * tan[i + 1][j - 1]);
  };
}

function sines(seed, n, fMin, fMax) {
  const r = mulberry(seed * 7919 + 17);
  const f = [], p = [], a = [];
  let sum = 0;
  for (let i = 0; i < n; i++) {
    f.push(TAU * (fMin + (fMax - fMin) * r()));
    p.push(TAU * r());
    const ai = 0.5 + 0.5 * r();
    a.push(ai);
    sum += ai;
  }
  for (let i = 0; i < n; i++) a[i] /= sum;
  return t => {
    let v = 0;
    for (let i = 0; i < n; i++) v += a[i] * Math.sin(f[i] * t + p[i]);
    return v;
  };
}

const RAMP = " .'`:-~=+<>()[]{}icuneaosxzQ0O#%&8B$@";
const EXTRA = "|/\\_=·*✦°˙•";
const GLYPHS = Array.from(new Set(Array.from(RAMP + EXTRA)));
const GI = new Map(GLYPHS.map((ch, i) => [ch, i]));
const gid = ch => (GI.has(ch) ? GI.get(ch) : -1);
const RL = RAMP.length;
const rampId = d => gid(RAMP[d <= 0 ? 0 : d >= 1 ? RL - 1 : Math.round(d * (RL - 1))]);

const ORIENT = ['-', '\\', '|', '/'];
function orientGlyph(angle) {
  let a = angle % Math.PI;
  if (a < 0) a += Math.PI;
  return ORIENT[Math.round(a / (Math.PI / 4)) % 4];
}
const orientId = angle => gid(orientGlyph(angle));

function makeGrid(cols, rows) {
  const N = cols * rows;
  const g = { cols, rows, N, G: new Int16Array(N), RGB: new Float32Array(N * 3) };
  g.G.fill(-1);
  return g;
}

function gridClear(g) {
  g.G.fill(-1);
}

function gridPut(g, i, gi, r, gr, b) {
  g.G[i] = gi;
  const o = i * 3;
  g.RGB[o] = r; g.RGB[o + 1] = gr; g.RGB[o + 2] = b;
}

function gridAdd(g, i, gi, r, gr, b) {
  if (g.G[i] >= 0) {
    const o = i * 3;
    if (g.RGB[o] + g.RGB[o + 1] + g.RGB[o + 2] >= r + gr + b) return;
  }
  gridPut(g, i, gi, r, gr, b);
}

function eulerMat(yaw, pitch, roll) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(-pitch), sp = Math.sin(-pitch);
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const a00 = cr, a01 = -sr, a10 = cp * sr, a11 = cp * cr, a12 = -sp, a20 = sp * sr, a21 = sp * cr, a22 = cp;
  return new Float32Array([
    cy * a00 + sy * a20, cy * a01 + sy * a21, sy * a22,
    a10, a11, a12,
    -sy * a00 + cy * a20, -sy * a01 + cy * a21, cy * a22,
  ]);
}

function mulMV(m, v, out) {
  const x = v[0], y = v[1], z = v[2];
  out[0] = m[0] * x + m[1] * y + m[2] * z;
  out[1] = m[3] * x + m[4] * y + m[5] * z;
  out[2] = m[6] * x + m[7] * y + m[8] * z;
  return out;
}

function makeCamera({ pos, target, fovY, w, h, px = 1, near = 0.05 }) {
  let fx = target[0] - pos[0], fy = target[1] - pos[1], fz = target[2] - pos[2];
  const fl = Math.hypot(fx, fy, fz) || 1;
  fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, rz = fx;
  const rl = Math.hypot(rx, rz) || 1;
  rx /= rl; rz /= rl;
  const ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;
  const focal = (h / 2) / Math.tan(fovY / 2);
  return { pos: pos.slice(), f: [fx, fy, fz], r: [rx, 0, rz], u: [ux, uy, uz], focal, w, h, px, near };
}

function project(cam, p, out) {
  const dx = p[0] - cam.pos[0], dy = p[1] - cam.pos[1], dz = p[2] - cam.pos[2];
  const z = dx * cam.f[0] + dy * cam.f[1] + dz * cam.f[2];
  if (z < cam.near) return false;
  const x = dx * cam.r[0] + dz * cam.r[2];
  const y = dx * cam.u[0] + dy * cam.u[1] + dz * cam.u[2];
  out[0] = cam.w / 2 + (cam.focal * x) / z / cam.px;
  out[1] = cam.h / 2 - (cam.focal * y) / z;
  out[2] = z;
  return true;
}

const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function norm(a) {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  a[0] /= l; a[1] /= l; a[2] /= l;
  return a;
}

function unproject(cam, sx, sy, depth) {
  const x = ((sx - cam.w / 2) * cam.px * depth) / cam.focal;
  const y = ((cam.h / 2 - sy) * depth) / cam.focal;
  return [
    cam.pos[0] + cam.f[0] * depth + cam.r[0] * x + cam.u[0] * y,
    cam.pos[1] + cam.f[1] * depth + cam.r[1] * x + cam.u[1] * y,
    cam.pos[2] + cam.f[2] * depth + cam.r[2] * x + cam.u[2] * y,
  ];
}

function makeSub(cols, rows, SX, SY) {
  const w = cols * SX, h = rows * SY, n = w * h;
  const s = {
    cols, rows, SX, SY, w, h,
    z: new Float32Array(n), lum: new Float32Array(n), rgb: new Float32Array(n * 3),
    id: new Int16Array(n), mark: new Uint8Array(n),
  };
  subClear(s);
  return s;
}

function subClear(s) {
  s.z.fill(Infinity);
  s.id.fill(-1);
  s.mark.fill(0);
}

function tri(s, A, B, C, id, mode = 0) {
  const ax = A[0], ay = A[1], bx = B[0], by = B[1], cx = C[0], cy = C[1];
  const area = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  if (!(Math.abs(area) > 1e-9)) return;
  const inv = 1 / area;
  let x0 = Math.floor(Math.min(ax, bx, cx)), x1 = Math.ceil(Math.max(ax, bx, cx));
  let y0 = Math.floor(Math.min(ay, by, cy)), y1 = Math.ceil(Math.max(ay, by, cy));
  if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
  if (x1 > s.w) x1 = s.w; if (y1 > s.h) y1 = s.h;
  if (x0 >= x1 || y0 >= y1) return;
  const { w, z, lum, rgb, mark } = s;
  const ids = s.id;
  const dax = -(cy - by) * inv, dbx = -(ay - cy) * inv;
  const Az = A[2], Bz = B[2], Cz = C[2], dzx = dax * Az + dbx * Bz - (dax + dbx) * Cz;
  for (let y = y0; y < y1; y++) {
    const py = y + 0.5, px0 = x0 + 0.5;
    let wa = ((bx - px0) * (cy - py) - (by - py) * (cx - px0)) * inv;
    let wb = ((cx - px0) * (ay - py) - (cy - py) * (ax - px0)) * inv;
    let d = wa * Az + wb * Bz + (1 - wa - wb) * Cz;
    let i = y * w + x0;
    for (let x = x0; x < x1; x++, i++, wa += dax, wb += dbx, d += dzx) {
      const wc = 1 - wa - wb;
      if (wa < -1e-9 || wb < -1e-9 || wc < -1e-9) continue;
      if (d >= z[i]) continue;
      z[i] = d;
      ids[i] = id;
      lum[i] = wa * A[3] + wb * B[3] + wc * C[3];
      const o = i * 3;
      rgb[o] = wa * A[4] + wb * B[4] + wc * C[4];
      rgb[o + 1] = wa * A[5] + wb * B[5] + wc * C[5];
      rgb[o + 2] = wa * A[6] + wb * B[6] + wc * C[6];
      const m7 = wa * A[7] + wb * B[7] + wc * C[7];
      if (mode === 1) {
        const u = wa * A[8] + wb * B[8] + wc * C[8];
        const k = Math.round(m7);
        mark[i] = u > 0.965 ? 1 : 0;
        if (u > 0.14 && u < 0.86 && k >= 1 && k <= 5 && Math.abs(m7 - k) < 0.07) {
          lum[i] *= 0.72; rgb[o] *= 0.8; rgb[o + 1] *= 0.8; rgb[o + 2] *= 0.85;
        }
      } else mark[i] = m7 > 0.5 ? 1 : 0;
    }
  }
}

function seg(s, x0, y0, z0, x1, y1, z1, l, r, g, b, id) {
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 1.5));
  const { w, h, z, lum, rgb, mark } = s;
  for (let k = 0; k <= steps; k++) {
    const u = k / steps;
    const x = Math.floor(x0 + (x1 - x0) * u), y = Math.floor(y0 + (y1 - y0) * u);
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const i = y * w + x, d = z0 + (z1 - z0) * u;
    if (d >= z[i]) continue;
    z[i] = d; s.id[i] = id; lum[i] = l; mark[i] = 1;
    const o = i * 3;
    rgb[o] = r; rgb[o + 1] = g; rgb[o + 2] = b;
  }
}


const DOT_ID = gid('.'), TICK_ID = gid("'"), DASH_ID = gid('-'), LOW_ID = gid('_');

function resolve(s, grid, opt = {}) {
  const { SX, SY, w, cols, rows } = s;
  const ax = opt.ax || 1, ay = opt.ay || 1;
  const minCov = opt.minCov ?? 0.15, gamma = opt.gamma ?? 0.85, gain = opt.gain ?? 1, dither = opt.dither ?? 0, bright = opt.bright ?? 1;
  const total = SX * SY;
  const cxm = (SX - 1) / 2, cym = (SY - 1) / 2;
  const { id, lum, rgb, mark } = s;
  const G = grid.G, RGB = grid.RGB;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let n = 0, L = 0, R_ = 0, Gc = 0, B = 0, sx = 0, sy = 0;
      let m = 0, mx = 0, my = 0, mxx = 0, myy = 0, mxy = 0;
      const base = r * SY * w + c * SX;
      for (let j = 0; j < SY; j++) {
        let i = base + j * w;
        for (let k = 0; k < SX; k++, i++) {
          if (id[i] < 0) continue;
          n++;
          L += lum[i];
          const o = i * 3;
          R_ += rgb[o]; Gc += rgb[o + 1]; B += rgb[o + 2];
          const dx = (k - cxm) * ax, dy = (j - cym) * ay;
          sx += dx; sy += dy;
          if (mark[i]) { m++; mx += dx; my += dy; mxx += dx * dx; myy += dy * dy; mxy += dx * dy; }
        }
      }
      const gi = grid.cols * r + c;
      if (gi >= G.length) continue;
      if (n === 0) { G[gi] = -1; continue; }
      const cov = n / total;
      L /= n; R_ /= n; Gc /= n; B /= n;
      let glyph;
      if (m >= 2 && m >= 0.12 * total) {
        mx /= m; my /= m;
        const vxx = mxx / m - mx * mx, vyy = myy / m - my * my, vxy = mxy / m - mx * my;
        glyph = orientId(0.5 * Math.atan2(2 * vxy, vxx - vyy));
      } else if (cov < minCov) {
        if (L * gain < 0.05) { G[gi] = -1; continue; }
        glyph = L > 0.5 ? TICK_ID : DOT_ID;
      } else if (cov < 0.9) {
        glyph = orientId(Math.atan2(sy / n, sx / n) + Math.PI / 2);
        if (glyph === DASH_ID && ((sy > 0 && cov < 0.45) || (sy < 0 && cov > 0.55))) glyph = LOW_ID;
      } else {
        const d = Math.pow(Math.min(1, L * gain), gamma) + (dither ? (hash(c, r, 5) - 0.5) * 2 * dither : 0);
        glyph = rampId(d);
      }
      const k = (0.35 + 0.65 * Math.min(1, cov)) * gain * bright;
      G[gi] = glyph;
      RGB[gi * 3] = R_ * k; RGB[gi * 3 + 1] = Gc * k; RGB[gi * 3 + 2] = B * k;
    }
  }
}


const DEG = Math.PI / 180;

const FORE = {
  origin: [0.03, 0.0],
  pts: [[0.06, 0.09], [0.32, 0.27], [0.72, 0.4], [1.04, 0.42], [1.12, 0.32], [1.04, 0.08], [0.92, -0.12], [0.8, -0.26], [0.52, -0.26], [0.24, -0.18], [0.06, -0.09]],
  veins: [0.2, 0.33, 0.46, 0.6, 0.74],
  outer: [0.3, 0.72],
};
const HIND = {
  origin: [0.03, -0.12],
  pts: [[0.06, -0.04], [0.36, -0.07], [0.7, -0.17], [0.88, -0.36], [0.86, -0.58], [0.68, -0.78], [0.43, -0.87], [0.22, -0.76], [0.1, -0.5], [0.05, -0.2]],
  veins: [0.18, 0.32, 0.46, 0.6, 0.74],
  outer: [0.12, 0.82],
  scallop: 7,
  eyes: [[0.68, 0.36, 0.1], [0.7, 0.62, 0.08]],
};

function catmull(p0, p1, p2, p3, u) {
  const u2 = u * u, u3 = u2 * u;
  return 0.5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
}

function outline(shape, n) {
  const P = shape.pts, m = P.length, raw = [];
  for (let s = 0; s < m - 1; s++) {
    const a = P[Math.max(0, s - 1)], b = P[s], c = P[s + 1], d = P[Math.min(m - 1, s + 2)];
    for (let k = 0; k < 24; k++) {
      const u = k / 24;
      raw.push([catmull(a[0], b[0], c[0], d[0], u), catmull(a[1], b[1], c[1], d[1], u)]);
    }
  }
  raw.push(P[m - 1].slice());
  const acc = [0];
  for (let i = 1; i < raw.length; i++) acc.push(acc[i - 1] + Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1]));
  const L = acc[acc.length - 1], out = [];
  let j = 0;
  for (let k = 0; k <= n; k++) {
    const target = (k / n) * L;
    while (j < acc.length - 2 && acc[j + 1] < target) j++;
    const f = (target - acc[j]) / Math.max(1e-9, acc[j + 1] - acc[j]);
    out.push([lerp(raw[j][0], raw[j + 1][0], f), lerp(raw[j][1], raw[j + 1][1], f)]);
  }
  return out;
}

function buildWing(shape, nu, nv) {
  const ring = outline(shape, nv);
  const [ox, oz] = shape.origin;
  const nVert = (nu + 1) * (nv + 1);
  const pos = new Float32Array(nVert * 2), uv = new Float32Array(nVert * 2), vp = new Float32Array(nVert);
  const albedo = new Float32Array(nVert), spots = new Float32Array(nVert), under = new Float32Array(nVert);
  const vk = [0, ...shape.veins, 1];
  for (let i = 0; i <= nu; i++) {
    const u = 0.04 + 0.96 * (i / nu);
    for (let k = 0; k <= nv; k++) {
      const v = k / nv;
      let rx = ring[k][0] - ox, rz = ring[k][1] - oz;
      if (shape.scallop) {
        const sc = 1 - 0.035 * Math.abs(Math.sin(v * Math.PI * shape.scallop)) * smooth(0.75, 1, u);
        rx *= sc; rz *= sc;
      }
      const q = i * (nv + 1) + k;
      pos[q * 2] = ox + rx * u; pos[q * 2 + 1] = oz + rz * u;
      uv[q * 2] = u; uv[q * 2 + 1] = v;
      const isOuter = v > shape.outer[0] && v < shape.outer[1];
      let j = 0;
      while (j < vk.length - 2 && v > vk[j + 1]) j++;
      vp[q] = j + (v - vk[j]) / (vk[j + 1] - vk[j]);
      let a = 0.9 - 0.18 * u;

      .sort((a, b) => (raw[a] / radials[a].Lmax + 0.6 * hash(a, j, 5)) - (raw[b] / radials[b].Lmax + 0.6 * hash(b, j, 5)));
    const pick = fresh.concat(rest).slice(0, n);
    for (const i of pick) raw[i] += VIS[j] * (radials[i].s === j ? 1.4 : 1);
    radials.forEach((p, i) => { p.cum[j] = raw[i]; });
  }
  radials.forEach(p => {
    const tot = p.cum[NH - 1] || 1;
    for (let j = 0; j < NH; j++) p.cum[j] = (p.cum[j] / tot) * p.Lmax;
  });
  const branches = [];
  radials.forEach((p, i) => {
    if (r() > 0.85) return;
    const start = p.Lmax * (0.3 + 0.35 * r());
    const [x, y] = pointAt(p, start);
    const a = p.angle + (r() < 0.5 ? -1 : 1) * (0.35 + 0.3 * r());
    branches.push({ parent: i, start, ...walk(r, x, y, a, p.Lmax * (0.15 + 0.2 * r()), 0.02, 0.4) });

  const rings = [], perHit = new Map();
  RING_R.forEach((rho, jr) => {

      if (k >= NH) continue;
      perHit.set(k, (perHit.get(k) || 0) + 1);
      const pa = pointAt(radials[a], rho), pb = pointAt(radials[b], rho);

      for (let m = 1; m < n; m++) {

      }
      pts.push(pb);
      for (let m = 1; m < pts.length; m++) acc.push(acc[m - 1] + Math.hypot(pts[m][0] - pts[m - 1][0], pts[m][1] - pts[m - 1][1]));

  for (let j = 0; j < NH; j++) cumW[j] = (j ? cumW[j - 1] : 0) + VIS[j];

}

function pulseAt(t) {
  let k = hitIndex(t, HIT_T) - 1, p = 0;
  while (k >= 0 && t - HIT_T[k] < 0.8) { p += VIS[k] * Math.exp(-(t - HIT_T[k]) / 0.16); k--; }
  return Math.min(1.4, p);
}

function crackAt(cr, t) {
  const n = cr.radials.length;
  const tt = Math.min(t, T.shatter - 1e-6);
  const k = hitIndex(tt, HIT_T), j = k - 1;
  const reach = new Float32Array(n), base = new Float32Array(n);

  if (k > 0) {
    grow = easeOut(clamp01((tt - HIT_T[j]) / 0.1));
    cr.radials.forEach((p, i) => {
      const prev = j > 0 ? p.cum[j - 1] : 0;
      base[i] = prev;
      reach[i] = prev + (p.cum[j] - prev) * grow;
    });
  }
  const breach = cr.branches.map(br => clamp01(((reach[br.parent] - br.start) * 1.2) / br.len) * br.len);
  const ringP = cr.rings.map(g => (g.k <= j ? easeOut(clamp01((tt - HIT_T[g.k] - 0.02) / 0.18)) : 0));
  const holeAt = jj => (jj < 0 ? 0 : 0.012 + 0.05 * Math.pow(cr.cumW[jj] / cr.cumW[NH - 1], 0.8));
  const hole = k ? holeAt(j - 1) + (holeAt(j) - holeAt(j - 1)) * grow : 0;
  const live = t < T.shatter && k > 0;
  const imp = live ? 4.5 * HITS[j][1] * HITS[j][1] * Math.exp(-(t - HIT_T[j]) / 0.1) : 0;
  const a = hash(k, 9, 1) * TAU;
  const trem = t < T.shatter ? 1.3 * smooth(30, T.shatter, t) : 0;
  const shake = [Math.cos(a) * imp + trem * Math.sin(t * 73), Math.sin(a) * imp + trem * Math.cos(t * 61)];
  return {
    k, reach, base, breach, ringP, hole, shake,
    flash: live ? pulseAt(t) : 0,
    leak: t < T.shatter ? Math.pow(smooth(29, T.shatter, t), 1.5) : 0,
    fade: 1 - smooth(T.shatter, T.shatter + 0.8, t),

}

function glassLayout(R) {
  const W = R.cols * R.CW, H = R.rows * R.CH;
  return { cols: R.cols, rows: R.rows, CW: R.CW, CH: R.CH, W, H, cx: 0.8 * W, cy: 0.42 * H, U: Math.min(W, H) };
}

function drawPoly(grid, L, p, reach, bright, fresh, freshB, glintAt) {
  const { pts, acc } = p;
  for (let m = 0; m + 1 < pts.length; m++) {
    if (acc[m] >= reach) break;
    const f = Math.min(1, (reach - acc[m]) / Math.max(1e-9, acc[m + 1] - acc[m]));
    const x0 = L.cx + pts[m][0] * L.U, y0 = L.cy + pts[m][1] * L.U;
    const x1 = x0 + (pts[m + 1][0] - pts[m][0]) * L.U * f, y1 = y0 + (pts[m + 1][1] - pts[m][1]) * L.U * f;
    const dx = x1 - x0, dy = y1 - y0;
    const g0 = orientId(Math.atan2(dy, dx));
    const steps = Math.ceil(Math.max(Math.abs(dx) / L.CW, Math.abs(dy) / L.CH) * 2) + 1;
    for (let s = 0; s <= steps; s++) {
      const u = s / steps, x = x0 + dx * u, y = y0 + dy * u;
      const c = Math.floor(x / L.CW), r = Math.floor(y / L.CH);
      if (c < 0 || r < 0 || c >= L.cols || r >= L.rows) continue;
      let gi = g0;
      if (gi === DASH && y / L.CH - r > 0.62) gi = LOW;
      const arc = acc[m] + (acc[m + 1] - acc[m]) * f * u;
      let b = bright;
      if (arc > fresh) b += freshB;
      if (glintAt >= 0 && Math.abs(arc - glintAt) < 0.03) b *= 1.9;
      b = Math.min(1.3, b);
      gridAdd(grid, r * L.cols + c, gi, ICE[0] * b, ICE[1] * b, ICE[2] * b);
    }
  }
}

function drawGlass(grid, cr, st, L, t) {
  if (st.k === 0 || st.fade <= 0) return;
  const fade = st.fade, base = (0.42 + 0.55 * st.flash) * fade;
  cr.radials.forEach((p, i) => {
    if (st.reach[i] <= 0) return;
    const g = ((t * 0.28 + p.sel) % 1.5) * p.Lmax;
    drawPoly(grid, L, p, st.reach[i], base * (0.75 + 0.25 * p.sel), st.base[i], 0.6 * st.flash * fade, g < st.reach[i] ? g : -1);
  });
  cr.branches.forEach((br, j) => {
    if (st.breach[j] > 0) drawPoly(grid, L, br, st.breach[j], base * 0.7, Infinity, 0, -1);
  });
  cr.rings.forEach((g, j) => {
    if (st.ringP[j] > 0) drawPoly(grid, L, g, st.ringP[j] * g.len, base * 0.62, Infinity, 0, -1);
  });
  if (t < T.shatter && st.hole > 0) {
    const rx = st.hole * L.U, c0 = Math.floor((L.cx - 2 * rx) / L.CW), c1 = Math.ceil((L.cx + 2 * rx) / L.CW);
    const r0 = Math.floor((L.cy - 2 * rx) / L.CH), r1 = Math.ceil((L.cy + 2 * rx) / L.CH);
    const fl = Math.floor(t * 9);
    for (let r = Math.max(0, r0); r <= Math.min(L.rows - 1, r1); r++) {
      for (let c = Math.max(0, c0); c <= Math.min(L.cols - 1, c1); c++) {
        const d = Math.hypot((c + 0.5) * L.CW - L.cx, (r + 0.5) * L.CH - L.cy) / rx;
        if (d < 1) {
          const b = (0.75 + 0.25 * st.flash + 0.2 * st.leak) * (0.8 + 0.2 * hash(c, r, fl));
          gridAdd(grid, r * L.cols + c, rampId(0.72 + 0.28 * hash(c, r, fl + 1)), ICE[0] * b, ICE[1] * b, ICE[2] * b);
        } else if (d < 1.9 && hash(c, r, 7) < 0.55 - (d - 1) * 0.5) {
          const b = 0.42 * (1 + 0.5 * st.flash);
          gridAdd(grid, r * L.cols + c, CRUSH[Math.floor(hash(c, r, 8) * CRUSH.length)], ICE[0] * b, ICE[1] * b, ICE[2] * b);
        }
      }
    }
    for (let q = Math.max(0, st.k - 6); q < st.k; q++) {
      const age = t - HIT_T[q];
      if (age < 0 || age > 1.4 || HITS[q][1] < 0.6) continue;
      for (let p = 0; p < 9; p++) {
        const vx = (hash(q, p, 1) - 0.5) * 0.25, vy = -0.05 + hash(q, p, 2) * 0.12;
        const x = L.cx + (vx * age) * L.U, y = L.cy + (vy * age + 0.32 * age * age) * L.U;
        const c = Math.floor(x / L.CW), r = Math.floor(y / L.CH);
        if (c < 0 || r < 0 || c >= L.cols || r >= L.rows) continue;
        const b = 0.6 * (1 - age / 1.4);
        gridAdd(grid, r * L.cols + c, DUST[p % DUST.length], ICE[0] * b, ICE[1] * b, ICE[2] * b);
      }

}


const SHATTER = 37.0, LIFE = 2.3;

function buildShards(cr, cam) {
  const aspect = (cam.w * cam.px) / cam.h;
  const uw = aspect < 1 ? 1 : 1 / aspect, uh = aspect < 1 ? aspect : 1;
  const toWorld = ([x, y]) => unproject(cam, (0.8 + x * uw) * cam.w, (0.42 + y * uh) * cam.h, GLASS_DEPTH);
  const order = cr.radials.map((p, i) => [((p.angle % 6.2832) + 6.2832) % 6.2832, i]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  const hole = holeWorld(cam);
  const r = mulberry(4242);
  const out = [];
  for (let q = 0; q < order.length; q++) {
    const A = cr.radials[order[q]], B = cr.radials[order[(q + 1) % order.length]];
    let da = B.angle - A.angle;
    while (da < 0) da += 6.2832;
    if (da > 2) continue;
    for (let j = 0; j + 1 < RING_R.length; j++) {
      const r0 = RING_R[j], r1 = RING_R[j + 1];
      if (A.final < r1 || B.final < r1) break;
      const corners = [pointAt(A, r0), pointAt(B, r0), pointAt(B, r1), pointAt(A, r1)].map(toWorld);
      const c = [0, 1, 2].map(k => corners.reduce((s, p) => s + p[k], 0) / 4);
      const dx = c[0] - hole[0], dy = c[1] - hole[1], dl = Math.hypot(dx, dy) || 1;
      const sp = (0.5 + 1.1 * r()) / (0.4 + r1 * 2);
      let ax = r() - 0.5, ay = r() - 0.5, az = r() - 0.5;
      const al = Math.hypot(ax, ay, az) || 1;
      out.push({
        c, local: corners.map(p => [p[0] - c[0], p[1] - c[1], p[2] - c[2]]),
        v: [(dx / dl) * sp, (dy / dl) * sp + 0.2, 1.6 + 2.4 * r()],
        axis: [ax / al, ay / al, az / al], spin: 2 + 4 * r(),
        t0: SHATTER + r0 * 0.25, sel: r(),
      });
    }
  }
  return out;
}

function rotate(axis, ang, v) {
  const c = Math.cos(ang), s = Math.sin(ang), [x, y, z] = axis;
  const d = x * v[0] + y * v[1] + z * v[2];
  return [
    v[0] * c + (y * v[2] - z * v[1]) * s + x * d * (1 - c),
    v[1] * c + (z * v[0] - x * v[2]) * s + y * d * (1 - c),
    v[2] * c + (x * v[1] - y * v[0]) * s + z * d * (1 - c),
  ];
}

function shardAt(s, t) {
  const age = t - s.t0;
  if (age < 0 || age > LIFE) return { visible: false };
  const pos = [s.c[0] + s.v[0] * age, s.c[1] + s.v[1] * age - 0.35 * age * age, s.c[2] + s.v[2] * age];
  if (pos[2] > GLASS_DEPTH - 0.6) return { visible: false };
  const k = 1 - 0.55 * (age / LIFE);
  const corners = s.local.map(p => { const q = rotate(s.axis, s.spin * age, p); return [pos[0] + q[0] * k, pos[1] + q[1] * k, pos[2] + q[2] * k]; });
  return { visible: true, pos, corners, fade: 1 - clamp01((age - LIFE + 0.6) / 0.6) };
}

function drawShards(grid, view, cam, shards, t, light) {
  const o = [0, 0, 0];
  for (const s of shards) {
    const st = shardAt(s, t);
    if (!st.visible) continue;
    const P = [];
    for (const c of st.corners) { if (!project(cam, c, o)) break; P.push([o[0] / view.SX, o[1] / view.SY]); }
    if (P.length < 4) continue;
    const [a, b, c] = st.corners;
    const e1 = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], e2 = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
    let n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
    const nl = Math.hypot(...n) || 1;
    n = n.map(v => v / nl);
    const vx = cam.pos[0] - st.pos[0], vy = cam.pos[1] - st.pos[1], vz = cam.pos[2] - st.pos[2], vl = Math.hypot(vx, vy, vz);
    if (n[0] * vx + n[1] * vy + n[2] * vz < 0) n = n.map(v => -v);
    const h = [light[0] + vx / vl, light[1] + vy / vl, light[2] + vz / vl], hl = Math.hypot(...h);
    const glint = Math.pow(Math.max(0, (n[0] * h[0] + n[1] * h[1] + n[2] * h[2]) / hl), 40);
    const edgeB = (0.26 + 0.9 * glint) * st.fade;
    if (glint > 0.6) {
      const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
      const c0 = Math.max(0, Math.floor(Math.min(...xs))), c1 = Math.min(grid.cols - 1, Math.ceil(Math.max(...xs)));
      const r0 = Math.max(0, Math.floor(Math.min(...ys))), r1 = Math.min(grid.rows - 1, Math.ceil(Math.max(...ys)));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        if ((r + c) & 1 || !inside(P, c + 0.5, r + 0.5)) continue;
        const bb = glint * 0.9 * st.fade;
        gridAdd(grid, r * grid.cols + c, rampId(0.35 + 0.5 * glint), 0.85 * bb, 0.94 * bb, bb);
      }
    }
    for (let k = 0; k < 4; k++) {
      const p = P[k], q = P[(k + 1) % 4];
      lineCells(grid, p[0], p[1], q[0], q[1], (view.ax * view.SX) / (view.ay * view.SY), edgeB);
    }
  }
}

function inside(P, x, y) {
  let s = 0;
  for (let k = 0; k < P.length; k++) {
    const a = P[k], b = P[(k + 1) % P.length];
    const cr = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
    if (cr !== 0) { if (s === 0) s = Math.sign(cr); else if (Math.sign(cr) !== s) return false; }
  }
  return true;
}

function lineCells(grid, x0, y0, x1, y1, aspect, b) {
  const dx = x1 - x0, dy = y1 - y0;
  const gi = orientId(Math.atan2(dy, dx * aspect));
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) * 2) + 1;
  for (let s = 0; s <= steps; s++) {
    const c = Math.floor(x0 + (dx * s) / steps), r = Math.floor(y0 + (dy * s) / steps);
    if (c < 0 || r < 0 || c >= grid.cols || r >= grid.rows) continue;
    gridAdd(grid, r * grid.cols + c, gi, 0.8 * b, 0.9 * b, b);
  }
}


const LIGHT = (() => { const v = [-0.45, 0.75, 0.5], l = Math.hypot(...v); return v.map(x => x / l); })();
const SPARK = ['.', '·', '+', '*', '✦'].map(gid);

function drawSparks(grid, view, cam, parts, tint = [0.8, 0.92, 1]) {
  const o = [0, 0, 0];
  for (const p of parts) {
    if (!project(cam, [p.x, p.y, p.z], o)) continue;
    const c = Math.floor(o[0] / view.SX), r = Math.floor(o[1] / view.SY);
    if (c < 0 || r < 0 || c >= grid.cols || r >= grid.rows) continue;
    const a = clamp01(p.a * (0.6 + 0.6 * p.s));
    const gi = SPARK[Math.min(4, Math.floor(a * 4.6))];
    gridAdd(grid, r * grid.cols + c, gi, tint[0] * a, tint[1] * a, tint[2] * a);
  }
}

function trail(path, t, seed, opt = {}) {
  const rate = opt.rate ?? 30, life = opt.life ?? 1.6, from = opt.from ?? -Infinity, to = opt.to ?? Infinity;
  const spread = opt.spread ?? 0.06, fall = opt.fall ?? 0.14;
  const out = [];
  const k0 = Math.ceil((t - life) * rate), k1 = Math.floor(t * rate);
  for (let k = k0; k <= k1; k++) {
    const tb = k / rate;
    if (tb < from || tb > to) continue;
    const age = t - tb;
    if (age < 0 || age > life) continue;
    const h1 = hash(k, seed, 1), h2 = hash(k, seed, 2), h3 = hash(k, seed, 3), h4 = hash(k, seed, 4);
    const p = path(tb);
    const vx = (h1 - 0.5) * 0.12, vy = -fall * (0.5 + h2), vz = (h3 - 0.5) * 0.12;
    const tw = Math.sin(age * 9 + h4 * 6.283);
    const a = Math.pow(1 - age / life, 1.4) * (0.55 + 0.45 * tw * tw);
    out.push({
      k,
      x: p[0] + (h1 - 0.5) * spread + vx * age,
      y: p[1] + (h2 - 0.5) * spread + vy * age,
      z: p[2] + (h3 - 0.5) * spread + vz * age,
      a,
      s: h4,
    });
  }
  return out;
}


const GLASS_DEPTH = 6;
const FOV = 0.75, EMERGE = 2.8, CLOSE = 11;

function storyCamera(view) {
  return makeCamera({ pos: [0, 1.0, GLASS_DEPTH], target: [0, 0, 0], fovY: FOV, w: view.w, h: view.h, px: view.px });
}

const holeWorld = cam => unproject(cam, 0.8 * cam.w, 0.42 * cam.h, GLASS_DEPTH);

function makeFlock(seed) {
  const out = [];
  for (let i = 0; i < 22; i++) {
    const r = mulberry(seed * 131 + i * 7 + 1);
    const size = 0.19 + 0.09 * r();
    const b = makeButterfly(seed * 100 + i, { size, freq: 2.3 + 0.9 * r() });
    b.index = i;
    b.birth = BIRTHS[i];
    b.white = i === 0;
    b.close = i === CLOSE;
    b.home = [0.15 + 0.7 * ((0.5 + i * 0.6180339887) % 1), 0.14 + 0.72 * ((0.3 + i * 0.7548776662) % 1), 4 + 5 * ((0.2 + i * 0.5698402910) % 1)];
    b.wx = sines(seed * 1000 + i * 3 + 1, 3, 0.04, 0.16);
    b.wy = sines(seed * 1000 + i * 3 + 2, 3, 0.05, 0.18);
    b.wz = sines(seed * 1000 + i * 3 + 3, 2, 0.03, 0.1);
    b.openAt = t => smooth(b.birth + 0.05, b.birth + 0.5, t);
    out.push(b);
  }
  return out;
}

function roam(b, t, cam) {
  const [u, v, d] = b.home;
  const H = unproject(cam, u * cam.w, v * cam.h, d);
  const vis = d * Math.tan(FOV / 2), halfW = (vis * cam.w * cam.px) / cam.h;
  return [H[0] + 0.16 * halfW * b.wx(t), H[1] + 0.14 * vis * b.wy(t), H[2] + 0.7 * b.wz(t)];
}

function hermite(p0, v0, p1, v1, u, h) {

  return [0, 1, 2].map(k => a * p0[k] + bb * h * v0[k] + c * p1[k] + d * h * v1[k]);
}

function flightPath(b, t, cam) {

    const v1 = [(q[0] - p1[0]) / 0.01, (q[1] - p1[1]) / 0.01, (q[2] - p1[2]) / 0.01];
    const dx = p1[0] - hole[0], dy = p1[1] - hole[1], dl = Math.hypot(dx, dy) || 1;
    const v0 = [(dx / dl) * 0.7, (dy / dl) * 0.7 + 0.2, 1.0];
    p = hermite(hole, v0, p1, v1, (t - b.birth) / EMERGE, EMERGE);
  } else p = roam(b, t, cam);
  if (b.close && t > T.closePass[0] && t < T.closePass[1]) {
    const w = Math.pow(Math.sin((Math.PI * (t - T.closePass[0])) / (T.closePass[1] - T.closePass[0])), 2) * 0.9;
    const target = unproject(cam, 0.52 * cam.w, 0.55 * cam.h, 1.7);
    p = [p[0] + (target[0] - p[0]) * w, p[1] + (target[1] - p[1]) * w, p[2] + (target[2] - p[2]) * w];
  }
  return p;
}

function inFrame(cam, p, margin) {
  const o = [0, 0, 0];
  if (!project(cam, p, o)) return false;
  return o[0] >= margin * cam.w && o[0] <= (1 - margin) * cam.w && o[1] >= margin * cam.h && o[1] <= (1 - margin) * cam.h;
}


const RAD = Math.PI / 180;
const CUP_H = 1.05, CUP_R = 0.36, CUP_Z = -0.2;
const CLOSED = [88 * RAD, 85 * RAD];

const PETALS = [
  { phi: 30 * RAD, outer: 1, wing: 0, sgn: 1 },
  { phi: 330 * RAD, outer: 0, wing: 1, sgn: 1 },
  { phi: 150 * RAD, outer: 1, wing: 0, sgn: -1 },
  { phi: 210 * RAD, outer: 0, wing: 1, sgn: -1 },
  { phi: 270 * RAD, outer: 1, wing: -1, sgn: 1 },
  { phi: 90 * RAD, outer: 0, wing: -1, sgn: 1 },
];

const PROF = [[0, 0.2], [0.12, 0.56], [0.3, 0.88], [0.5, 1], [0.7, 0.97], [0.86, 0.86], [1, 0.72]];
function profile(u) {
  let k = 0;
  while (k < PROF.length - 2 && u > PROF[k + 1][0]) k++;
  const [u0, r0] = PROF[k], [u1, r1] = PROF[k + 1];
  return lerp(r0, r1, smoothU(clamp01((u - u0) / (u1 - u0))));
}

function halfWidth(u, outer) {
  const W = outer ? 1.14 : 1.02;
  return W * (0.55 + 0.45 * Math.sin((Math.min(u / 0.55, 1) * Math.PI) / 2)) * (1 - 0.94 * Math.pow(smooth(0.58, 1, u), 1.2));
}

function petalPoint(u, v, pet, flip, out) {
  const s = flip * (2 * v - 1);
  const a = pet.phi + s * halfWidth(u, pet.outer);
  const rr = CUP_R * profile(u) * (pet.outer ? 1 : 0.84) * (1 + 0.07 * (1 - s * s));
  out[0] = rr * Math.cos(a);
  out[1] = CUP_H * u * (pet.outer ? 1 : 0.97);
  out[2] = CUP_Z + rr * Math.sin(a);
  return out;
}

function petalGrid(nu, nv) {
  const n = (nu + 1) * (nv + 1), uv = new Float32Array(n * 2), tris = [];
  for (let i = 0; i <= nu; i++) for (let k = 0; k <= nv; k++) {
    const q = i * (nv + 1) + k;
    uv[q * 2] = 0.04 + 0.96 * (i / nu); uv[q * 2 + 1] = k / nv;
  }
  for (let i = 0; i < nu; i++) for (let k = 0; k < nv; k++) {
    const a = i * (nv + 1) + k, b = a + 1, c = a + nv + 1, d = c + 1;
    tris.push(a, c, b, b, c, d);
  }
  return { nu, nv, uv, tris: new Uint16Array(tris) };
}

const flipOf = pet => (pet.wing >= 0 ? -pet.sgn : 1);
const P_TMP = [0, 0, 0];

function buildMorph(lod) {
  const wm = wingMeshes(lod), src = [wm.fore, wm.hind];
  return PETALS.map(pet => {
    const g = pet.wing >= 0 ? src[pet.wing] : src[0];
    const n = (g.nu + 1) * (g.nv + 1);
    const P0 = new Float32Array(n * 3), P1 = new Float32Array(n * 3), E = new Float32Array(n);
    for (let q = 0; q < n; q++) {
      const u = g.uv[q * 2], v = g.uv[q * 2 + 1];
      petalPoint(u, v, pet, flipOf(pet), P_TMP);
      P1[q * 3] = P_TMP[0]; P1[q * 3 + 1] = P_TMP[1]; P1[q * 3 + 2] = P_TMP[2];
      if (pet.wing >= 0) {
        wingLocal(g, q, CLOSED[pet.wing], 0, pet.sgn, P_TMP);
        P0[q * 3] = P_TMP[0]; P0[q * 3 + 1] = P_TMP[1]; P0[q * 3 + 2] = P_TMP[2];
      } else {
        P0[q * 3] = 0; P0[q * 3 + 1] = 0; P0[q * 3 + 2] = CUP_Z;
      }
      E[q] = 1 - 0.8 * Math.min(v, 1 - v);
    }
    return { pet, g, n, P0, P1, E, P: new Float32Array(n * 3), W: new Float32Array(n * 3), S3: new Float32Array(n * 3), sh: new Float32Array(n * 4) };
  });
}

function buildCup(nu, nv) {
  const g = petalGrid(nu, nv), n = (nu + 1) * (nv + 1);
  return PETALS.map(pet => {
    const P = new Float32Array(n * 3), E = new Float32Array(n);
    for (let q = 0; q < n; q++) {
      const u = g.uv[q * 2], v = g.uv[q * 2 + 1];
      petalPoint(u, v, pet, 1, P_TMP);
      P[q * 3] = P_TMP[0]; P[q * 3 + 1] = P_TMP[1]; P[q * 3 + 2] = P_TMP[2];
      E[q] = 1 - 0.8 * Math.min(v, 1 - v);
    }
    return { pet, g, n, P, E, W: new Float32Array(n * 3), S3: new Float32Array(n * 3), sh: new Float32Array(n * 4) };
  });
}

const MORPHS = {}, CUPS = {};
const morphParts = lod => (MORPHS[lod] ||= buildMorph(lod));
const CUP_RES = [[8, 12], [5, 7], [3, 4], [2, 3]];
const cupParts = lod => (CUPS[lod] ||= buildCup(...CUP_RES[lod]));

const easeM = (m, u) => smoothU(clamp01((m - 0.15 * u) / 0.85));
const growNew = m => smoothU(clamp01((m - 0.5) / 0.5));

function morphInto(part, m) {
  const { n, P0, P1, P, g, pet } = part;
  const k = pet.wing < 0 ? growNew(m) : 0;
  for (let q = 0; q < n; q++) {
    const e = pet.wing < 0 ? k : easeM(m, g.uv[q * 2]);
    P[q * 3] = lerp(P0[q * 3], P1[q * 3], e);
    P[q * 3 + 1] = lerp(P0[q * 3 + 1], P1[q * 3 + 1], e);
    P[q * 3 + 2] = lerp(P0[q * 3 + 2], P1[q * 3 + 2], e);
  }
  return P;
}

function morphMesh(m, lod = 0) {
  return { parts: morphParts(lod).map(p => ({ phi: p.pet.phi, outer: p.pet.outer, nu: p.g.nu, nv: p.g.nv, P: Float32Array.from(morphInto(p, m)) })) };
}

function wind(x, z, t) {
  return 0.045 * Math.sin(1.25 * t - 0.7 * x + 0.25 * z) + 0.02 * Math.sin(2.3 * t - 1.9 * x + 0.8 * z + 1.3);
}

const RED_DEEP = [0.36, 0.03, 0.06], RED = [0.95, 0.17, 0.14], RED_HI = [1, 0.5, 0.36], RED_IN = [0.42, 0.04, 0.07];
const CREAM = [1, 0.96, 0.82], CREAM_DEEP = [0.82, 0.76, 0.58];
const STEM = [0.16, 0.36, 0.2], LEAF = [0.12, 0.3, 0.16];

function shadeTulip(P, N, cam, L, u, ax, az, white, fog, out, o) {
  let vx = cam.pos[0] - P[0], vy = cam.pos[1] - P[1], vz = cam.pos[2] - P[2];
  const vl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
  vx /= vl; vy /= vl; vz /= vl;
  let nx = N[0], ny = N[1], nz = N[2];
  let ndv = nx * vx + ny * vy + nz * vz;
  if (ndv < 0) { nx = -nx; ny = -ny; nz = -nz; ndv = -ndv; }
  const inside = nx * (P[0] - ax) + nz * (P[2] - az) < 0;
  const key = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
  let hx = L[0] + vx, hy = L[1] + vy, hz = L[2] + vz;
  const hl = Math.sqrt(hx * hx + hy * hy + hz * hz) || 1;
  const sp = Math.pow(Math.max(0, (nx * hx + ny * hy + nz * hz) / hl), 18);
  const om = 1 - ndv, rim = om * om;
  let lum, r, g, b;
  if (white) {
    lum = 0.4 + 0.3 * key + 0.25 * sp + 0.1 * rim;
    const k = 1.0 + 0.25 * Math.min(1, lum), c = clamp01(0.35 + 0.65 * key);
    r = lerp(CREAM_DEEP[0], CREAM[0], c) * k; g = lerp(CREAM_DEEP[1], CREAM[1], c) * k; b = lerp(CREAM_DEEP[2], CREAM[2], c) * k;
    if (inside) { lum *= 0.75; r *= 0.85; g *= 0.85; b *= 0.8; }
  } else {
    lum = 0.26 + 0.55 * key + 0.4 * sp + 0.15 * rim;
    const base = smooth(0, 0.6, u), hi = clamp01(0.8 * sp + 0.22 * key * u);
    const k = 0.5 + 0.7 * Math.min(1, lum);
    r = lerp(lerp(RED_DEEP[0], RED[0], base), RED_HI[0], hi) * k;
    g = lerp(lerp(RED_DEEP[1], RED[1], base), RED_HI[1], hi) * k;
    b = lerp(lerp(RED_DEEP[2], RED[2], base), RED_HI[2], hi) * k;
    if (inside) { lum *= 0.55; r = RED_IN[0] * k; g = RED_IN[1] * k; b = RED_IN[2] * k; }
  }
  out[o] = Math.min(1.3, lum) * fog;
  out[o + 1] = r * fog; out[o + 2] = g * fog; out[o + 3] = b * fog;
}

const TV = [0, 0, 0], TV2 = [0, 0, 0], TP = [0, 0, 0], TN = [0, 0, 0], TB = [0, 0, 0, 0];
const TA = new Array(9).fill(0), TBv = new Array(9).fill(0), TC = new Array(9).fill(0), FACE = new Uint8Array(4096);

function rasterPart(sub, cam, part, M, X, opt) {
  const { g, n, W, S3, sh, E } = part;
  const nv1 = g.nv + 1, wingPart = part.pet.wing >= 0 && opt.m < 1;
  for (let q = 0; q < n; q++) {
    TV[0] = X.src[q * 3] * X.s; TV[1] = X.src[q * 3 + 1] * X.s; TV[2] = X.src[q * 3 + 2] * X.s;
    mulMV(M, TV, TV2);
    const lx = X.o[0] + TV2[0] - X.g[0], ly = X.o[1] + TV2[1] - X.g[1];
    W[q * 3] = X.g[0] + lx * X.ca - ly * X.sa;
    W[q * 3 + 1] = X.g[1] + lx * X.sa + ly * X.ca;
    W[q * 3 + 2] = X.o[2] + TV2[2];
  }
  for (let i = 0; i <= g.nu; i++) for (let k = 0; k <= g.nv; k++) {
    const q = i * nv1 + k;
    const qa = Math.min(g.nu, i + 1) * nv1 + k, qb = Math.max(0, i - 1) * nv1 + k;
    const ka = i * nv1 + Math.min(g.nv, k + 1), kb = i * nv1 + Math.max(0, k - 1);
    const dux = W[qa * 3] - W[qb * 3], duy = W[qa * 3 + 1] - W[qb * 3 + 1], duz = W[qa * 3 + 2] - W[qb * 3 + 2];
    const dvx = W[ka * 3] - W[kb * 3], dvy = W[ka * 3 + 1] - W[kb * 3 + 1], dvz = W[ka * 3 + 2] - W[kb * 3 + 2];
    const nx = duy * dvz - duz * dvy, ny = duz * dvx - dux * dvz, nz = dux * dvy - duy * dvx;
    const nl = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
    TP[0] = W[q * 3]; TP[1] = W[q * 3 + 1]; TP[2] = W[q * 3 + 2];
    TN[0] = nx / nl; TN[1] = ny / nl; TN[2] = nz / nl;
    if (opt.cull) {
      const rx = TP[0] - X.axis[0], rz = TP[2] - X.axis[1];
      const outw = TN[0] * rx + TN[2] * rz >= 0 ? 1 : -1;
      const vdot = (TN[0] * (cam.pos[0] - TP[0]) + TN[1] * (cam.pos[1] - TP[1]) + TN[2] * (cam.pos[2] - TP[2])) * outw;
      FACE[q] = vdot > 0 ? 1 : 0;
    }
    const u = g.uv[q * 2];
    shadeTulip(TP, TN, cam, opt.light, u, X.axis[0], X.axis[1], opt.white, opt.fog, sh, q * 4);
    if (wingPart && opt.cm < 1) {
      TN[0] *= part.pet.sgn; TN[1] *= part.pet.sgn; TN[2] *= part.pet.sgn;
      shadeVertex(TP, TN, cam, opt.light, g.albedo[q], 0, g.spots[q], g.under[q], opt.fogB, TB, 0);
      for (let j = 0; j < 4; j++) sh[q * 4 + j] = lerp(TB[j], sh[q * 4 + j], opt.cm);
    }
    if (opt.flat < 1) {
      const L0 = sh[q * 4];
      sh[q * 4] = 0.4 * opt.fog + (L0 - 0.4 * opt.fog) * opt.flat;
    }
    if (!project(cam, TP, TV)) { S3[q * 3 + 2] = -1; continue; }
    S3[q * 3] = TV[0]; S3[q * 3 + 1] = TV[1]; S3[q * 3 + 2] = TV[2];
  }
  const marks = opt.marks, vein = wingPart && opt.cm < 0.3;
  const fill = (A, q) => {
    A[0] = S3[q * 3]; A[1] = S3[q * 3 + 1]; A[2] = S3[q * 3 + 2];
    A[3] = sh[q * 4]; A[4] = sh[q * 4 + 1]; A[5] = sh[q * 4 + 2]; A[6] = sh[q * 4 + 3];
    A[7] = vein ? g.vp[q] : 0;
    A[8] = !marks ? 0 : wingPart ? lerp(g.uv[q * 2], part.pet.outer ? E[q] : 0, opt.cm) : part.pet.outer ? E[q] : 0;
  };
  const T3 = g.tris;
  for (let k = 0; k < T3.length; k += 3) {
    const a = T3[k], b = T3[k + 1], c = T3[k + 2];
    if (S3[a * 3 + 2] < 0 || S3[b * 3 + 2] < 0 || S3[c * 3 + 2] < 0) continue;
    if (opt.cull && !(FACE[a] | FACE[b] | FACE[c]) && g.uv[a * 2] < 0.8) continue;
    fill(TA, a); fill(TBv, b); fill(TC, c);
    tri(sub, TA, TBv, TC, opt.id, 1);
  }
}

function stemLine(sub, cam, x0, y0, z0, x1, y1, z1, bend, lum, col, id, thick) {
  const o0 = [0, 0, 0], o1 = [0, 0, 0];
  const N = 5;
  let ok0 = false;
  for (let k = 0; k <= N; k++) {
    const u = k / N;
    const x = lerp(x0, x1, u) + bend * Math.sin(Math.PI * u), y = lerp(y0, y1, u), z = lerp(z0, z1, u);
    const ok = project(cam, [x, y, z], o1);
    if (ok && ok0) {
      seg(sub, o0[0], o0[1], o0[2] + 0.01, o1[0], o1[1], o1[2] + 0.01, lum, col[0] * lum * 2, col[1] * lum * 2, col[2] * lum * 2, id);
      if (thick) seg(sub, o0[0] + 1, o0[1], o0[2] + 0.01, o1[0] + 1, o1[1], o1[2] + 0.01, lum, col[0] * lum * 2, col[1] * lum * 2, col[2] * lum * 2, id);
    }
    o0[0] = o1[0]; o0[1] = o1[1]; o0[2] = o1[2]; ok0 = ok;
  }
}

function leaf(sub, cam, gx, gy, gz, ang, len, wid, grow, fog, id, marks) {
  if (grow <= 0.02) return;
  const NU = 6, pts = [];
  const ca = Math.cos(ang), sa = Math.sin(ang);
  for (let i = 0; i <= NU; i++) {
    const s = i / NU, h = len * grow * s;
    const out = len * grow * 0.32 * s * s;
    const w = wid * Math.sin(Math.PI * Math.min(1, 0.15 + 0.85 * s)) * (1 - 0.85 * s);
    for (const side of [-1, 1]) {
      const px = gx + ca * out - sa * w * side, pz = gz + sa * out + ca * w * side, py = gy + h;
      const o = [0, 0, 0];
      if (!project(cam, [px, py, pz], o)) return;
      const lum = (0.22 + 0.25 * s) * fog;
      pts.push([o[0], o[1], o[2], lum, LEAF[0] * (0.7 + s) * fog, LEAF[1] * (0.7 + s) * fog, LEAF[2] * (0.7 + s) * fog, 0, marks ? 1 : 0]);
    }
  }
  for (let i = 0; i < NU; i++) {
    const a = pts[i * 2], b = pts[i * 2 + 1], c = pts[i * 2 + 2], d = pts[i * 2 + 3];
    tri(sub, a, c, b, id, 1);
    tri(sub, b, c, d, id, 1);
  }
}

function drawTulip(sub, cam, tl, m, light, id, opt = {}) {
  const S = tl.size, grow = opt.grow ?? 1;
  const ca0 = Math.cos(tl.yaw), sa0 = Math.sin(tl.yaw);
  const cupX = tl.pos[0] + sa0 * CUP_Z * S, cupZ = tl.pos[2] + ca0 * CUP_Z * S;
  const gx = cupX, gy = tl.ground, gz = cupZ;
  const dist = Math.hypot(tl.pos[0] - cam.pos[0], tl.pos[1] - cam.pos[1], tl.pos[2] - cam.pos[2]);
  const o = [0, 0, 0];
  if (!project(cam, [cupX, tl.pos[1], cupZ], o)) return;
  const span = (cam.focal * S * 1.4) / Math.max(0.1, dist);
  if (o[0] < -span * 2 || o[0] > cam.w + span * 2 || o[1] < -span * 2) return;
  const sway = (opt.sway ?? 1) * (opt.t !== undefined ? wind(gx, gz, opt.t) : 0);
  const headY = gy + (tl.pos[1] - gy) * Math.min(1, grow * 1.15);
  const bloom = 1 + ((tl.bloom ?? 1) - 1) * smooth(0.08, 0.7, m);
  const sc = S * bloom * (grow >= 1 ? 1 : Math.max(0, smoothU(clamp01(grow)) * (1 + 0.12 * Math.sin(Math.PI * clamp01(grow)))));
  if (sc <= 1e-4 && m >= 1) return;
  const fogK = 1 - 0.74 * clamp01((dist - 5) / 20);
  const dim = opt.dim ?? 1;
  const fog = fogK * dim * (opt.bright ?? 1);
  const M = eulerMat(tl.yaw, 0, 0);
  const X = {
    s: sc, g: [gx, gy, gz], o: [tl.pos[0], headY, tl.pos[2]],
    ca: Math.cos(sway), sa: Math.sin(sway), axis: [cupX, cupZ], src: null,
  };
  const cm = smooth(0.08, 0.7, m);
  const flat = opt.flat ?? (1 - 0.55 * clamp01((dist - 6) / 16));
  const common = { light, white: !!tl.white, fog, fogB: opt.fogB ?? fog, id, m, cm, flat, marks: span > 26 };
  if (m < 1) {
    const spanB = (cam.focal * S * 2.4) / Math.max(0.1, dist);
    const lod = spanB > 90 ? 0 : spanB > 38 ? 1 : 2;
    for (const part of morphParts(lod)) {
      if (part.pet.wing < 0 && m <= 0.5) continue;
      X.src = morphInto(part, m);
      rasterPart(sub, cam, part, M, X, common);
    }
    const bodyK = 1 - smooth(0, 0.45, m);
    if (bodyK > 0.02) {
      const P = [X.o[0], X.o[1], X.o[2]];
      drawBody(sub, cam, M, P, S, light, fog, id, bodyK);
    }
  } else {
    const lod = span > 70 ? 0 : span > 30 ? 1 : span > 14 ? 2 : 3;
    common.cull = true;
    for (const part of cupParts(lod)) {
      if (lod >= 1 && !part.pet.outer && !tl.white) continue;
      X.src = part.P;
      rasterPart(sub, cam, part, M, X, common);
    }
  }
  const stemK = m < 1 ? smooth(0.15, 1, m) : 1;
  if (stemK > 0.01) {
    const hy = headY - gy, topX = gx - hy * X.sa, topY = gy + hy * X.ca;
    const botX = topX + (gx - topX) * stemK, botY = topY + (gy - topY) * stemK;
    const lum = (tl.white ? 0.5 : 0.26) * fog;
    const col = tl.white ? [0.55, 0.62, 0.42] : STEM;
    stemLine(sub, cam, topX, topY, gz, botX, botY, gz, 0.02 * (hash(tl.seed || 0, 1, 1) - 0.5) * stemK, lum, col, id, span > 60);
  }
  const leafK = m < 1 ? smooth(0.6, 1, m) : Math.min(1, grow * 1.3);
  if (span > 18 && leafK > 0.02) {
    const h = hash(tl.seed || 0, 2, 3);
    const L = (headY - gy) * (0.45 + 0.2 * h);
    leaf(sub, cam, gx, gy, gz, tl.yaw + 1.2 + h, L, 0.05 * (S / 0.24), leafK, fog * 0.75, id, false);
    if (h > 0.4) leaf(sub, cam, gx, gy, gz, tl.yaw - 2.2 + h, L * 0.8, 0.045 * (S / 0.24), leafK, fog * 0.65, id, false);
  }
}


const GROUND = -2.0;
const F_FOV = 0.75, F_RAD = Math.PI / 180;
const CAM_A = { pos: [0, 1, 6], target: [0, 0, 0] };
const CAM_B = { pos: [0, 0.4, 6.6], target: [0, -0.25, 0] };
const DOLLY = [0, -0.25, -1.2];
const BLOOM = 1.6, WHITE_SIZE = 0.46, HEAD_Y = -1.0, WHITE_Y = -0.55;
const DOWNBEAT = 35.69;
const sx = p => p[0] / (CAM_B.pos[2] - p[2]);

const mix3 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
const pushAt = t => easeInOut(clamp01((t - T.pushFrom) / (T.end - T.pushFrom)));

function fieldCamera(view, t) {
  const e = easeInOut(clamp01((t - T.morph) / 8)), p = pushAt(t);
  const d = [DOLLY[0] * p, DOLLY[1] * p, DOLLY[2] * p];
  const pos = mix3(CAM_A.pos, CAM_B.pos, e), target = mix3(CAM_A.target, CAM_B.target, e);
  return makeCamera({
    pos: [pos[0] + d[0], pos[1] + d[1], pos[2] + d[2]], target: [target[0] + d[0], target[1] + d[1], target[2] + d[2]],
    fovY: F_FOV, w: view.w, h: view.h, px: view.px,
  });
}

const ROW_D = [2.9, 3.5, 4.2, 5.0, 5.9, 6.8, 7.8, 8.9, 10.2, 11.7, 13.5, 15.7, 18.4, 21.7, 25.8, 31];
const WHITE_D = 4.6;

function makeField(seed, aspect) {
  const r = mulberry(seed * 7919 + 17);
  const tanH = Math.tan(F_FOV / 2) * aspect;
  const hw = z => (CAM_B.pos[2] - z) * tanH;
  const white = { pos: [0, WHITE_Y, CAM_B.pos[2] - WHITE_D], white: true };
  const rows = ROW_D.map((d, k) => [k, d, Math.max(2, (2.1 * d * tanH) / (0.36 + 0.03 * d))]);
  const total = rows.reduce((a, x) => a + x[2], 0), cap = Math.max(1, total / 140);
  const all = [];
  for (const [k, d, n0] of rows) {
    const n = Math.max(2, Math.round(n0 / cap)), z0 = CAM_B.pos[2] - d;
    const shift = (k % 2 ? 0.5 : 0) / n;
    for (let j = 0; j < n; j++) {
      const z = z0 + (r() - 0.5) * 0.25 * (ROW_D[Math.min(k + 1, ROW_D.length - 1)] - ROW_D[Math.max(0, k - 1)]);
      const f = -1 + (2 * j + 1) / n + 2 * shift - shift + (r() - 0.5) * (0.8 / n);
      const x = 1.05 * hw(z) * f;
      if (d < WHITE_D + 0.3 && Math.abs(x) < 0.28) continue;
      all.push({ k, d: CAM_B.pos[2] - z, pos: [x, HEAD_Y + (r() - 0.5) * 0.14, z], size: (0.21 + 0.07 * r()) * BLOOM, yaw: r() * Math.PI * 2, h: r() });
    }
  }
  const cand = all.filter(c => c.d > WHITE_D + 0.3 && c.d < 10.5).sort((a, b) => sx(a.pos) - sx(b.pos));
  const pick = new Set();
  for (let i = 0; i < 21; i++) pick.add(cand[Math.min(cand.length - 1, Math.floor(((i + 0.5) * cand.length) / 21))]);
  const front = [white, ...[...pick].map(c => ({ pos: c.pos, white: false }))];
  const back = all.filter(c => !pick.has(c)).sort((a, b) => a.d - b.d).map((c, i) => ({
    pos: c.pos, yaw: c.yaw, size: c.size, ground: GROUND, white: false, seed: 100 + i,
    rise: 54 + 8.6 * clamp01((c.k - 0) / (ROW_D.length - 1)) + 0.5 * c.h,
    dim: c.d < 3.2 ? 0.5 : c.d < 3.8 ? 0.7 : 1, flat: c.d < 3.8 ? 0.6 : undefined,
  }));
  return { front, back, aspect };
}


function landingPlan(flock, field, fcam) {
  const E8 = BAR / 8, q8 = t => DOWNBEAT + Math.round((t - DOWNBEAT) / E8) * E8;
  const plan = [];
  const non = flock.filter(b => !b.white), white = flock.find(b => b.white);
  [...non].sort((a, c) => hash(a.index, 7, 7) - hash(c.index, 7, 7)).forEach((b, k, arr) => {
    const td = q8(53.6 + (k * (60.0 - 53.6)) / (arr.length - 1));
    plan[b.index] = { td, ts: Math.max(T.morph, td - 2.4) };
  });
  const tdW = q8(61.38);
  plan[white.index] = { td: tdW, ts: tdW - 2.6 };
  const spots = field.front.filter(s => !s.white).map(s => s.pos).sort((a, c) => sx(a) - sx(c));
  non.map(b => [b, sx(flightPath(b, plan[b.index].ts, fcam))]).sort((a, c) => a[1] - c[1])
    .forEach(([b], i) => { plan[b.index].spot = spots[i]; });
  plan[white.index].spot = field.front.find(s => s.white).pos;
  for (const b of flock) {
    const L = plan[b.index], f = flightPath(b, L.ts, fcam), dx = L.spot[0] - f[0];
    L.dir = dx > 0.05 ? 1 : dx < -0.05 ? -1 : b.index % 2 ? 1 : -1;
    L.tulip = { pos: L.spot, yaw: (L.dir * Math.PI) / 2, size: b.size, bloom: b.white ? WHITE_SIZE / b.size : BLOOM, ground: GROUND, white: b.white, seed: b.index };
  }
  return plan;
}

function herm(p0, v0, p1, v1, u) {
  const u2 = u * u, u3 = u2 * u;
  const a = 2 * u3 - 3 * u2 + 1, b = u3 - 2 * u2 + u, c = -2 * u3 + 3 * u2, d = u3 - u2;
  return [0, 1, 2].map(k => a * p0[k] + b * v0[k] + c * p1[k] + d * v1[k]);
}

function landingPath(b, t, L, fcam) {
  if (t <= L.ts) return flightPath(b, t, fcam);
  const p0 = flightPath(b, L.ts, fcam), p1 = flightPath(b, L.ts + 0.02, fcam);
  const D = L.td - L.ts, h = D / 2;
  const u = clamp01((t - L.ts) / D), ue = 1 - (1 - u) * (1 - u);
  const v0 = [0, 1, 2].map(k => ((p1[k] - p0[k]) / 0.02) * h);
  const v1 = [L.dir * 0.5 * D, -0.3 * D, 0];
  return herm(p0, v0, L.spot, v1, ue);
}

function turnTo(a, b, u) {
  let d = b - a;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return a + d * u;
}

const BRAKE = 0.75;
const brakeAngle = tau => (tau < 0.35 ? 70 - 100 * smoothU(tau / 0.35) : -30 + 118 * smoothU((tau - 0.35) / 0.65)) * F_RAD;

function landingPose(b, t, L, fcam) {
  const path = tt => landingPath(b, Math.min(tt, L.td), L, fcam);
  const pose = poseAt(b, t, path);
  if (t <= L.ts) return pose;
  const k = smooth(L.td - 0.6, L.td, t), p = path(t);
  pose.pos = mix3(pose.pos, p, k);
  pose.yaw = turnTo(pose.yaw, (L.dir * Math.PI) / 2, smooth(L.td - 1.1, L.td - 0.15, t));
  pose.pitch = lerp(pose.pitch, 0, k);
  pose.roll = lerp(pose.roll, 0, k);
  const tb = L.td - BRAKE, w = smooth(tb - 0.15, tb + 0.05, t);
  if (w > 0) {
    const tau = clamp01((t - tb) / BRAKE), a = brakeAngle(tau);
    pose.fore = lerp(pose.fore, a, w);
    pose.hind = lerp(pose.hind, a - 3 * F_RAD * smooth(0.6, 1, tau), w);
    pose.flex *= 1 - w;
  }
  return pose;
}

function whiteBloom(L) {
  const beat = BAR / 4;
  return DOWNBEAT + Math.floor((L.td + 1.5 - DOWNBEAT) / beat + 1e-9) * beat;
}

const morphAt = (L, t) => smoothU(clamp01((t - L.td - 0.05) / (L.tulip.white ? whiteBloom(L) - L.td - 0.05 : 1.5)));

const RING_V = 2.6, RING_LIFE = 3;
function ringBoost(L, dist, t) {
  const a = t - whiteBloom(L);
  if (a < 0 || a >= RING_LIFE) return 1;
  const s = Math.pow(1 - a / RING_LIFE, 1.5), x = (dist - RING_V * a) / 0.45;
  return 1 + 0.9 * s * Math.exp(-x * x);
}

function gather(L, t) {
  const tb = whiteBloom(L), t0 = L.td + 0.1, out = [];
  if (t < t0 || t > tb + 0.05) return out;
  const S = L.tulip.size * L.tulip.bloom, c = L.spot, cy = c[1] + 0.5 * CUP_H * S;
  for (let k = 0; k < 44; k++) {
    const h1 = hash(k, 3, 21), h2 = hash(k, 3, 22), h3 = hash(k, 3, 23);
    const st = t0 + 0.45 * h3, q = clamp01((t - st) / (tb - st));
    if (q <= 0) continue;
    const r = S * (2.4 + 2.2 * h1) * (1 - Math.pow(q, 1.6)), th = h2 * Math.PI * 2 + 2.4 * q;
    out.push({ x: c[0] + Math.cos(th) * r, y: cy + (h1 - 0.5) * S * 1.6 * (1 - q), z: c[2] + Math.sin(th) * r * 0.8, a: Math.pow(Math.sin(Math.PI * q), 0.6), s: h3 });
  }
  return out;
}

function ringSparks(L, t) {
  const a = t - whiteBloom(L), out = [];
  if (a < 0 || a >= RING_LIFE) return out;
  const R = RING_V * a, s = Math.pow(1 - a / RING_LIFE, 1.5);
  for (let k = 0; k < 120; k++) {
    const h1 = hash(k, 5, 31), h2 = hash(k, 5, 32), th = (k / 120) * Math.PI * 2 + h1 * 0.05;
    const rr = R + (h2 - 0.5) * 0.35;
    out.push({ x: L.spot[0] + Math.cos(th) * rr, y: HEAD_Y + 0.32 + 0.1 * h2, z: L.spot[2] + Math.sin(th) * rr, a: s * (0.45 + 0.55 * h1), s: h2 });
  }
  return out;
}

const DIRT = ['.', '`', "'", '·'].map(gid);
function makeGround(seed, aspect) {
  const r = mulberry(seed * 31 + 7), out = [];
  const tanH = Math.tan(F_FOV / 2) * aspect;
  for (let i = 0; i < 420; i++) {
    const d = 3.2 * Math.pow(34 / 3.2, r()), z = CAM_B.pos[2] - d;
    out.push([(r() * 2 - 1) * d * tanH * 1.1, z, DIRT[Math.floor(r() * 4)], 0.5 + 0.5 * r(), d > 12 ? HEAD_Y + 0.25 * r() : GROUND]);
  }
  return out;
}

function morphBurst(L, t) {
  const w = L.tulip.white, t0 = w ? whiteBloom(L) : L.td + 0.25, dur = 1.2, n = w ? 46 : 18;
  const a = (t - t0) / dur;
  if (a < 0 || a > 1) return [];
  const S = L.tulip.size * L.tulip.bloom * (w ? 1.5 : 1), c = L.spot, out = [];
  for (let k = 0; k < n; k++) {
    const h1 = hash(k, L.tulip.seed, 11), h2 = hash(k, L.tulip.seed, 12), h3 = hash(k, L.tulip.seed, 13);
    const th = h1 * Math.PI * 2, ph = (h2 - 0.3) * 1.6, rr = S * (0.35 + 1.9 * Math.sqrt(a)) * (0.6 + 0.4 * h3);
    out.push({
      x: c[0] + Math.cos(th) * Math.cos(ph) * rr,
      y: c[1] + 0.5 * CUP_H * S + Math.sin(ph) * rr + 0.25 * a * S,
      z: c[2] + Math.sin(th) * Math.cos(ph) * rr,
      a: Math.pow(1 - a, 1.5), s: h3,
    });
  }
  return out;
}

function halo(fx, view, cam, L, t) {
  const tb = whiteBloom(L), g = smooth(tb - 0.4, tb + 1.2, t);
  if (g <= 0) return;
  const S = L.tulip.size * (1 + (L.tulip.bloom - 1) * smooth(0.08, 0.7, morphAt(L, t))), sw = wind(L.spot[0], L.spot[2], t) * smooth(0.5, 1, morphAt(L, t));
  const hy = L.spot[1] - GROUND;
  const base = [L.spot[0] - hy * Math.sin(sw), GROUND + hy * Math.cos(sw), L.spot[2] + CUP_Z * S];
  const o = [0, 0, 0], o2 = [0, 0, 0], o3 = [0, 0, 0];
  if (!project(cam, [base[0], base[1] + 0.5 * CUP_H * S, base[2]], o)) return;
  project(cam, [base[0], base[1] + CUP_H * S, base[2]], o2);
  project(cam, [base[0], GROUND + 0.25 * hy, base[2]], o3);
  const k = view.R.CW / view.SX, ky = view.R.CH / view.SY;
  const cx = o[0] * k, cy = o[1] * ky, ch = Math.max(8, (o[1] - o2[1]) * ky);
  const pulse = 1 + 0.09 * Math.sin(2 * Math.PI * 0.22 * t);
  const R = ch * 2.1 * pulse, a = 0.34 * g * pulse;
  const gr = fx.createRadialGradient(cx, cy, 0, cx, cy, R);
  gr.addColorStop(0, `rgba(255,246,222,${a})`);
  gr.addColorStop(0.4, `rgba(255,236,200,${a * 0.45})`);
  gr.addColorStop(1, 'rgba(255,230,190,0)');
  fx.fillStyle = gr;
  fx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  const fl = t >= tb ? Math.exp(-(t - tb) / 0.35) : smooth(tb - 0.25, tb, t);
  if (fl > 0.01) {
    const R2 = ch * 5.5;
    const g2 = fx.createRadialGradient(cx, cy, 0, cx, cy, R2);
    g2.addColorStop(0, `rgba(255,250,235,${0.6 * fl})`);
    g2.addColorStop(0.3, `rgba(255,240,210,${0.25 * fl})`);
    g2.addColorStop(1, 'rgba(255,235,200,0)');
    fx.fillStyle = g2;
    fx.fillRect(cx - R2, cy - R2, 2 * R2, 2 * R2);
  }
  const sy0 = cy + ch * 0.45, sy1 = o3[1] * ky, sw2 = ch * 0.5;
  const lg = fx.createLinearGradient(0, sy0, 0, sy1);
  lg.addColorStop(0, `rgba(235,245,215,${0.26 * g})`);
  lg.addColorStop(1, 'rgba(235,245,215,0)');
  fx.fillStyle = lg;
  fx.beginPath();
  fx.ellipse(cx, (sy0 + sy1) / 2, sw2, Math.max(1, (sy1 - sy0) / 2), 0, 0, Math.PI * 2);
  fx.fill();
}

const FS = { key: '', field: null, plan: null, ground: null };

function fieldState(view, flock) {
  const vv = { w: view.sub.w, h: view.sub.h, px: view.px };
  const key = vv.w + 'x' + vv.h;
  if (FS.key !== key) {
    const aspect = (vv.w * vv.px) / vv.h;
    FS.key = key;
    FS.field = makeField(5, aspect);
    FS.plan = landingPlan(flock, FS.field, storyCamera(vv));
    FS.ground = makeGround(9, aspect);
  }
  return FS;
}

function renderField(t, view, grid, fx, flock) {
  const vv = { w: view.sub.w, h: view.sub.h, px: view.px };
  const S = fieldState(view, flock);
  const fcam = storyCamera(vv), cam = fieldCamera(vv, t), sub = view.sub;
  const others = 1 - 0.22 * pushAt(t);
  const W = S.plan[flock.find(b => b.white).index];
  const boost = p => ringBoost(W, Math.hypot(p[0] - W.spot[0], p[2] - W.spot[2]), t);
  subClear(sub);
  const nBack = Math.round(S.field.back.length * (view.back ?? 1));
  S.field.back.forEach((tl, i) => {
    if (i >= nBack) return;
    const g = clamp01((t - tl.rise) / 1.3);
    if (g > 0) drawTulip(sub, cam, tl, 1, LIGHT, 40 + i, { t, grow: g, dim: tl.dim * others, flat: tl.flat, bright: boost(tl.pos) });
  });
  for (const b of flock) {
    const L = S.plan[b.index], br = b.white ? 1.12 : 1;
    if (t < L.td) {
      drawButterfly(sub, cam, b, landingPose(b, t, L, fcam), LIGHT, b.index + 1, { fogNear: 4, fogFar: 10.5, bright: br });
    } else {
      const m = morphAt(L, t), d = Math.hypot(L.spot[0] - cam.pos[0], L.spot[1] - cam.pos[1], L.spot[2] - cam.pos[2]);
      let glowW = 1;
      if (b.white) {
        const tb = whiteBloom(L);
        glowW = 1 + 0.5 * Math.sin(Math.PI * m) + (t >= tb ? 0.6 * Math.exp(-(t - tb) / 0.3) : 0);
      }
      drawTulip(sub, cam, L.tulip, m, LIGHT, b.index + 1, {
        t, sway: smooth(0.5, 1, m), dim: b.white ? 1 : others, bright: b.white ? br * glowW : br * boost(L.spot),
        fogB: br * (1 - 0.7 * clamp01((d - 4) / 6.5)),
      });
    }
  }
  resolve(sub, grid, { ax: view.ax, ay: view.ay, gain: 1.3, dither: 0.04, bright: 1.3 });
  for (const b of flock) {
    const L = S.plan[b.index];
    if (t < L.td + 1.4) {
      drawSparks(grid, view, cam, trail(tt => landingPath(b, Math.min(tt, L.td), L, fcam), t, b.index + 11,
        { from: b.birth + 0.15, to: L.td, rate: 14, life: 1.4, spread: 0.05, fall: 0.1 }));
    }
    if (t >= L.td) drawSparks(grid, view, cam, morphBurst(L, t), b.white ? [1, 0.97, 0.86] : [1, 0.6, 0.48]);
    if (b.white && t >= L.td) {
      drawSparks(grid, view, cam, gather(L, t), [1, 0.95, 0.8]);
      drawSparks(grid, view, cam, ringSparks(L, t), [1, 0.9, 0.75]);
    }
  }
  const gA = smooth(52.5, 57, t);
  if (gA > 0) {
    const o = [0, 0, 0];
    for (const [x, z, gi, k, y] of S.ground) {
      if (!project(cam, [x, y, z], o)) continue;
      const c = Math.floor(o[0] / view.SX), r = Math.floor(o[1] / view.SY);
      if (c < 0 || r < 0 || c >= grid.cols || r >= grid.rows) continue;
      const f = gA * k * (1 - 0.75 * clamp01((o[2] - 4) / 26)) * (0.85 + 0.15 * Math.sin(1.25 * t - 0.7 * x));
      if (y > GROUND) gridAdd(grid, r * grid.cols + c, gi, 0.42 * f, 0.07 * f, 0.08 * f);
      else gridAdd(grid, r * grid.cols + c, gi, 0.1 * f, 0.24 * f, 0.13 * f);
    }
  }
  if (fx) halo(fx, view, cam, S.plan[flock.find(b => b.white).index], t);
  return { shake: [0, 0], glow: 0.9 };
}

LYRICS.forEach(p => { p.from = p.words[0].t; });

function phraseAt(t) {
  let cur = null;
  for (const p of LYRICS) if (t >= p.from) cur = p;
  return cur;

const wordAlpha = (wd, t) => (t < wd.t ? 0 : wd.fade ? clamp01((t - wd.t) / wd.fade) : 1);
const variantAt = t => Math.floor(t * LY_FPS) % 3;
const lyricsAlpha = t => 1 - smooth(92, 97, t);

const approxMeasure = (text, font, px) => text.length * px * (font === 'script' ? 0.46 : 0.58);
const LINE_H = 1.18, GAP = 0.3, PAD = 0.22;

function layoutLyrics(ph, W, H, measure = approxMeasure) {
  const top = LY_TOP * H, bottom = SKY * H, nl = Math.max(...ph.words.map(x => x.line)) + 1;
  const base = 100, lines = [];
  for (let l = 0; l < nl; l++) {
    const ws = ph.words.filter(x => x.line === l);
    const widths = ws.map(x => measure(x.text, x.font, base * x.size) + 2 * PAD * base * x.size);
    const width = widths.reduce((a, b) => a + b, 0) + GAP * base * (ws.length - 1);
    const height = Math.max(...ws.map(x => x.size)) * base * LINE_H;
    lines.push({ ws, widths, width, height });
  }
  const tw = Math.max(...lines.map(l => l.width)), th = lines.reduce((a, l) => a + l.height, 0);
  const extra = ph.hearts ? 1.25 : 1;
  const k = Math.min((0.88 * W) / (tw * extra), (0.92 * (bottom - top)) / (th * (ph.hearts ? 1.12 : 1)), (Math.min(W, H * 1.1) * 0.12) / base);
  const fs = base * k;
  let y = top + (bottom - top - th * k) / 2;
  const out = [];
  for (const l of lines) {
    let x = (W - l.width * k) / 2;
    l.ws.forEach((wd, i) => {
      const bw = l.widths[i] * k, bh = wd.size * fs * LINE_H;
      out.push({ word: wd, x, y: y + (l.height * k - bh) / 2, w: bw, h: bh, fs: wd.size * fs });
      x += bw + GAP * base * k;
    });
    y += l.height * k;
  }
  const hearts = [];
  if (ph.hearts) {
    const r = mulberry(Math.round(ph.from * 100));
    const x0 = Math.min(...out.map(b => b.x)), x1 = Math.max(...out.map(b => b.x + b.w));
    const y0 = Math.min(...out.map(b => b.y)), y1 = Math.max(...out.map(b => b.y + b.h));
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, n = ph.hearts[1];
    const hit = (x, y, sz) => out.some(b => x < b.x + b.w && x + sz > b.x && y < b.y + b.h && y + sz > b.y)
      || hearts.some(h => x < h.x + h.w + 2 && x + sz + 2 > h.x && y < h.y + h.h + 2 && y + sz + 2 > h.y);
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * Math.PI * 2 + r() * 0.5, s = fs * (0.32 + 0.16 * r()), d0 = 0.15 + 0.3 * r();
      let placed = null;
      for (let tryA = 0; tryA < 7 && !placed; tryA++) {
        const a = a0 + (tryA % 2 ? 1 : -1) * Math.ceil(tryA / 2) * 0.35;
        for (let step = 0; step < 14 && !placed; step++) {
          const d = fs * (d0 + 0.18 * step);
          const hx = Math.max(2, Math.min(W - s - 2, cx + Math.cos(a) * ((x1 - x0) / 2 + d) - s / 2));
          const hy = Math.max(top * 0.5, Math.min(bottom - s - 2, cy + Math.sin(a) * ((y1 - y0) / 2 + d * 0.6) - s / 2));
          if (!hit(hx, hy, s)) placed = { x: hx, y: hy, w: s, h: s, i };
        }
      }
      if (placed) hearts.push(placed);
    }
  }
  return { words: out, hearts, fs, from: ph.hearts ? ph.hearts[0] : Infinity };
}

const LY = { ready: false, cache: new Map(), layoutKey: '', layouts: null, mctx: null };

async function loadLyricFonts() {
  if (typeof document === 'undefined' || !window.FontFace) return;
  for (const k of Object.keys(FONTS)) {
    const f = FONTS[k], bin = atob(f.data), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const face = new FontFace(f.family, buf.buffer, { weight: String(f.weight) });
    try { await face.load(); document.fonts.add(face); } catch (e) { }
  }
  LY.ready = true;
}

const fontCss = (font, px) => `${FONTS[font].weight} ${px}px ${FONTS[font].family}, ${font === 'script' ? 'cursive' : 'sans-serif'}`;

function lyMeasure(text, font, px) {
  if (!LY.mctx) LY.mctx = document.createElement('canvas').getContext('2d');
  LY.mctx.font = fontCss(font, px);
  return LY.mctx.measureText(text).width;
}

function lyCanvas(wd, ht) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(wd)); c.height = Math.max(1, Math.ceil(ht));
  return c;
}

function boil(src, amp, seed) {
  const r = mulberry(seed), ph = [r() * 6.28, r() * 6.28, r() * 6.28, r() * 6.28];
  const a = lyCanvas(src.width, src.height), b = lyCanvas(src.width, src.height);
  const ga = a.getContext('2d'), gb = b.getContext('2d');
  for (let y = 0; y < src.height; y += 2) {
    const dx = amp * (Math.sin(y * 0.11 + ph[0]) * 0.6 + Math.sin(y * 0.37 + ph[1]) * 0.4);
    ga.drawImage(src, 0, y, src.width, 2, dx, y, src.width, 2);
  }
  for (let x = 0; x < src.width; x += 2) {
    const dy = amp * (Math.sin(x * 0.09 + ph[2]) * 0.6 + Math.sin(x * 0.31 + ph[3]) * 0.4);
    gb.drawImage(a, x, 0, 2, src.height, x, dy, 2, src.height);
  }
  return b;
}

function blobPath(g, x, y, bw, bh, seed, round) {
  const r = mulberry(seed), n = 36, ph = [r() * 6.28, r() * 6.28];
  g.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    const p = round ? 2.2 : 5, sx = Math.sign(ca) * Math.pow(Math.abs(ca), 2 / p), sy = Math.sign(sa) * Math.pow(Math.abs(sa), 2 / p);
    const k = 1 + 0.05 * Math.sin(a * 5 + ph[0]) + 0.035 * Math.sin(a * 11 + ph[1]) + (r() - 0.5) * 0.03;
    const px = x + bw / 2 + (sx * bw * k) / 2, py = y + bh / 2 + (sy * bh * k) / 2;
    if (i) g.lineTo(px, py); else g.moveTo(px, py);
  }
  g.closePath();
}

function heartPath(g, cx, cy, s, seed) {
  const r = mulberry(seed);
  g.beginPath();
  for (let i = 0; i <= 48; i++) {
    const a = (i / 48) * Math.PI * 2, k = 1 + (r() - 0.5) * 0.06;
    const hx = 16 * Math.pow(Math.sin(a), 3), hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
    const px = cx + (hx / 34) * s * k, py = cy + (hy / 34) * s * k + s * 0.04;
    if (i) g.lineTo(px, py); else g.moveTo(px, py);
  }
  g.closePath();
}

function wordVariant(box, v) {
  const wd = box.word, fs = box.fs;
  const pad = fs * 0.6, cw = box.w + 2 * pad, ch = box.h + 2 * pad;
  {
    const seed = Math.round(wd.t * 100) * 7 + wd.text.length * 13 + v * 101;
    const r = mulberry(seed);
    const base = lyCanvas(cw, ch), g = base.getContext('2d');
    if (wd.hl === 'blob' || wd.hl === 'soft' || wd.hl === 'box') {
      g.fillStyle = wd.hl === 'soft' ? C_BLOB_SOFT : C_BLOB;
      const ex = wd.hl === 'box' ? 0.08 : 0.16;
      blobPath(g, pad - fs * ex, pad + box.h * 0.12, box.w + 2 * fs * ex, box.h * 0.82, seed + 1, wd.hl !== 'box');
      g.fill();
    } else if (wd.hl === 'heart') {
      g.fillStyle = C_BLOB;
      heartPath(g, pad + box.w / 2, pad + box.h * 0.52, box.h * 1.05, seed + 2);
      g.fill();
    }
    const ink = lyCanvas(cw, ch), gi = ink.getContext('2d');
    gi.font = fontCss(wd.font, fs);
    gi.textBaseline = 'middle';
    gi.lineJoin = 'round';
    const tx0 = pad + PAD * fs, ty = pad + box.h * 0.53;
    const color = wd.ink ? C_INK : wd.color;
    const draw = (dx, dy, col) => {
      let x = tx0;
      for (let i = 0; i < wd.text.length; i++) {
        const chh = wd.text[i];
        const adv = gi.measureText(wd.text.slice(0, i + 1)).width - gi.measureText(wd.text.slice(0, i)).width;
        gi.save();
        gi.translate(x + adv / 2 + dx + (r() - 0.5) * fs * 0.05, ty + dy + (r() - 0.5) * fs * 0.06);
        gi.rotate((r() - 0.5) * 0.09);
        gi.scale(1 + (r() - 0.5) * 0.06, 1 + (r() - 0.5) * 0.06);
        gi.fillStyle = col; gi.strokeStyle = col;
        gi.lineWidth = fs * (wd.bold ? 0.085 : wd.font === 'block' ? 0.04 : 0.015);
        gi.fillText(chh, -adv / 2, 0);
        gi.strokeText(chh, -adv / 2, 0);
        gi.restore();
        x += adv;
      }
    };
    if (wd.hl === 'shadow') draw(fs * 0.07, fs * 0.08, C_ROSE);
    draw(0, 0, color);
    g.drawImage(ink, 0, 0);
    const boiled = boil(base, Math.max(0.6, fs * 0.022), seed + 3);
    const fin = lyCanvas(cw, ch), gf = fin.getContext('2d');
    if (!wd.ink) { gf.shadowColor = 'rgba(255,226,214,0.45)'; gf.shadowBlur = fs * 0.22; }
    gf.drawImage(boiled, 0, 0);
    return fin;
  }
}

function heartVariant(s, seed, v) {
  const pad = s * 0.3, c = lyCanvas(s + 2 * pad, s + 2 * pad), g = c.getContext('2d');
  g.fillStyle = C_HEART;
  heartPath(g, pad + s / 2, pad + s / 2, s * 0.95, seed * 7 + v * 31);
  g.fill();
  return boil(c, Math.max(0.5, s * 0.03), seed * 13 + v);
}

function entryFor(key, ph, pad, make) {
  let e = LY.cache.get(key);
  if (!e) { e = { sprites: [], pad, ph, make }; LY.cache.set(key, e); }
  return e;
}

function grow(e, budget) {
  while (e.sprites.length < 3 && budget.n > 0) { e.sprites.push(e.make(e.sprites.length)); budget.n--; }
  return e;
}

function entriesOf(pi, L) {
  const out = [];
  for (const b of L.words) {
    const wd = b.word;
    out.push([b, entryFor(`w|${pi}|${wd.text}|${wd.t}`, pi, b.fs * 0.6, v => wordVariant(b, v))]);
  }
  for (const hb of L.hearts) out.push([hb, entryFor(`h|${pi}|${hb.i}`, pi, hb.w * 0.3, v => heartVariant(hb.w, hb.i + 1, v))]);
  return out;
}

function syncLayout(W, H) {
  const key = `${W}x${H}`;
  if (LY.layoutKey !== key) { LY.layoutKey = key; LY.layouts = new Map(); LY.cache.clear(); }
}

function layoutOf(pi, W, H) {
  const ph = LYRICS[pi];
  if (!LY.layouts.has(ph)) LY.layouts.set(ph, layoutLyrics(ph, W, H, lyMeasure));
  return LY.layouts.get(ph);
}

const phraseIndex = t => { let k = -1; LYRICS.forEach((p, i) => { if (t >= p.from) k = i; }); return k; };

function prewarmLyrics(t, W, H, n = 1) {
  if (!LY.ready || typeof document === 'undefined') return;
  syncLayout(W, H);
  const ci = phraseIndex(t);
  for (const [k, e] of LY.cache) if (e.ph < ci) LY.cache.delete(k);
  const budget = { n };
  for (let pi = Math.max(0, ci); pi < LYRICS.length && LYRICS[pi].from <= t + 4 && budget.n > 0; pi++) {
    for (const [, e] of entriesOf(pi, layoutOf(pi, W, H))) { grow(e, budget); if (budget.n <= 0) break; }
  }
}

function lyricsCacheInfo() {
  let built = 0;
  const phs = new Set();
  for (const e of LY.cache.values()) { built += e.sprites.length; phs.add(e.ph); }
  return { built, phrases: [...phs] };
}



function drawLyrics(g, t, W, H) {
  if (!LY.ready || !g) return;
  const pi = phraseIndex(t), A = lyricsAlpha(t);
  if (pi < 0 || A <= 0) return;
  syncLayout(W, H);
  const L = layoutOf(pi, W, H), v = variantAt(t), all = { n: Infinity };
  g.save();
  for (const [b, e] of entriesOf(pi, L)) {
    const isWord = !!b.word;
    const a = isWord ? wordAlpha(b.word, t) * A : t >= L.from ? A * clamp01((t - L.from) / 0.15) : 0;
    if (a <= 0) continue;
    grow(e, all);
    g.globalAlpha = a;
    g.drawImage(e.sprites[(v + (isWord ? b.word.text.length : b.i)) % 3], b.x - e.pad, b.y - e.pad);
  }
  g.restore();
}


function makeView(R, SX = 3, SY = 4) {
  return { R, sub: makeSub(R.cols, R.rows, SX, SY), SX, SY, px: (R.CW / SX) / (R.CH / SY), ax: R.CW / SX, ay: R.CH / SY };

function viewCamera(view, pos, target, fovY) {

const CRACKS = buildCracks(7);

function drawLeak(fx, L, amount, flash) {
  const a = Math.min(1, amount * 0.55 + flash * 0.12);
  if (a <= 0.01) return;
  const g = fx.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, L.U * (0.12 + 0.2 * amount));
  g.addColorStop(0, `rgba(200,230,255,${a})`);
  g.addColorStop(0.35, `rgba(120,180,255,${a * 0.35})`);
  g.addColorStop(1, 'rgba(60,110,200,0)');
  fx.fillStyle = g;
  fx.fillRect(0, 0, L.W, L.H);
}

const FLOCK = makeFlock(3);
const SHARDS = { key: '', list: null };
const BURST = ['.', "'", '`', '*', '·'].map(gid);

function burst(grid, view, cam, t) {
  const age = t - T.shatter;
  if (age < 0 || age > 1.6) return;
  const o = [0, 0, 0], h = holeWorld(cam);
  if (!project(cam, h, o)) return;
  const cx = o[0] / view.SX, cy = o[1] / view.SY;
  const rad = (6 + 55 * (1 - Math.pow(1 - age / 1.6, 2))) ;
  for (let k = 0; k < 90; k++) {
    const a = hash(k, 3, 3) * 6.2832, rr = rad * (0.55 + 0.45 * hash(k, 4, 4));
    const c = Math.floor(cx + Math.cos(a) * rr), r = Math.floor(cy + Math.sin(a) * rr * view.ax / view.ay * view.SY / view.SX * 0.5 + 9 * age * age);
    if (c < 0 || r < 0 || c >= grid.cols || r >= grid.rows) continue;
    const b = (1 - age / 1.6) * (0.5 + 0.5 * hash(k, 5, 5));
    gridAdd(grid, r * grid.cols + c, BURST[k % BURST.length], 0.8 * b, 0.9 * b, b);
  }
}

function renderStory(t, view, grid, fx) {
  const out = { shake: [0, 0], glow: 0.9 };
  if (t >= T.morph) return renderField(t, view, grid, fx, FLOCK);
  const L = glassLayout(view.R);
  const cam = storyCamera({ w: view.sub.w, h: view.sub.h, px: view.px });
  if (t >= T.shatter) {
    subClear(view.sub);
    for (const b of FLOCK) {
      if (t <= b.birth) continue;
      const path = tt => flightPath(b, tt, cam);
      drawButterfly(view.sub, cam, b, poseAt(b, t, path), LIGHT, b.index + 1, { fogNear: 4, fogFar: 10.5, bright: b.white ? 1.12 : 1 });
    }
    resolve(view.sub, grid, { ax: view.ax, ay: view.ay, gain: 1.3, dither: 0.1, bright: 1.3 });
    for (const b of FLOCK) {
      if (t <= b.birth + 0.15) continue;
      drawSparks(grid, view, cam, trail(tt => flightPath(b, tt, cam), t, b.index + 11, { from: b.birth + 0.15, rate: 14, life: 1.4, spread: 0.05, fall: 0.1 }));
    }
    const key = view.sub.w + 'x' + view.sub.h;
    if (SHARDS.key !== key) { SHARDS.key = key; SHARDS.list = buildShards(CRACKS, cam); }
    if (t < 39.6) drawShards(grid, view, cam, SHARDS.list, t, LIGHT);
    burst(grid, view, cam, t);
    const fl = 1 - (t - T.shatter) / 0.45;
    if (fl > 0) { fx.fillStyle = `rgba(215,235,255,${0.7 * fl * fl})`; fx.fillRect(0, 0, L.W + 64, L.H + 64); }
  }
  if (t < 40) {
    const st = crackAt(CRACKS, t);
    drawGlass(grid, CRACKS, st, L, t);
    drawLeak(fx, L, st.leak, st.flash);
    out.shake = st.shake;
  }
  return out;
}
